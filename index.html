<title>DMN</title>

    .switch {

        transform: translateX(22px);

</div>

<script>

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const imageButton =
    document.getElementById("imageButton");

const imageInput =
    document.getElementById("imageInput");

const removeImageButton =
    document.getElementById("removeImageButton");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const messages =
    document.getElementById("messages");

const statusText =
    document.getElementById("status");

const chatScreen =
    document.getElementById("chatScreen");

const settingsScreen =
    document.getElementById("settingsScreen");

const settingsButton =
    document.getElementById("settingsButton");

const settingsBackButton =
    document.getElementById("settingsBackButton");

const voiceToggle =
    document.getElementById("voiceToggle");

const englishToggle =
    document.getElementById("englishToggle");


let voiceEnabled =
    localStorage.getItem("dmn_voice") === "true";

let englishEnabled =
    localStorage.getItem("dmn_english") === "true";

let selectedImage = null;


voiceToggle.checked =
    voiceEnabled;

englishToggle.checked =
    englishEnabled;


function ayarlariGuncelle() {

    voiceEnabled =
        voiceToggle.checked;

    englishEnabled =
        englishToggle.checked;

    localStorage.setItem(
        "dmn_voice",
        voiceEnabled
    );

    localStorage.setItem(
        "dmn_english",
        englishEnabled
    );

    statusText.textContent =
        voiceEnabled
            ? (
                englishEnabled
                    ? "🔊 Voice: English"
                    : "🔊 Sesli cevap: Açık"
            )
            : (
                englishEnabled
                    ? "🔊 Voice: Off | 🇬🇧 English"
                    : "🔊 Sesli cevap: Kapalı"
            );
}


voiceToggle.addEventListener(
    "change",
    ayarlariGuncelle
);

englishToggle.addEventListener(
    "change",
    ayarlariGuncelle
);


settingsButton.addEventListener(
    "click",
    function() {

        chatScreen.style.display =
            "none";

        settingsScreen.style.display =
            "block";
    }
);


settingsBackButton.addEventListener(
    "click",
    function() {

        settingsScreen.style.display =
            "none";

        chatScreen.style.display =
            "flex";
    }
);


ayarlariGuncelle();


function mesajEkle(text, type) {

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent =
        text;

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


function resimEkle(src) {

    const div =
        document.createElement("div");

    div.className =
        "message user";

    const img =
        document.createElement("img");

    img.src = src;

    img.className =
        "message-image";

    div.appendChild(img);

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


function kodIstegiMi(mesaj) {

    const text =
        mesaj.toLowerCase();

    const kelimeler = [
        "kod ver",
        "kodu ver",
        "kod yaz",
        "kodu yaz",
        "kod oluştur",
        "kod olustur",
        "kod yap",
        "program yaz",
        "program oluştur",
        "program olustur"
    ];

    return kelimeler.some(
        kelime =>
            text.includes(kelime)
    );
}


function resimIstegiMi(mesaj) {

    const text =
        mesaj.toLowerCase();

    const kelimeler = [
        "resim oluştur",
        "resim olustur",
        "resim yap",
        "fotoğraf oluştur",
        "fotoğraf olustur",
        "görsel oluştur",
        "gorsel olustur",
        "bir resim çiz",
        "resim çiz"
    ];

    return kelimeler.some(
        kelime =>
            text.includes(kelime)
    );
}


imageButton.addEventListener(
    "click",
    function() {

        imageInput.click();

    }
);


imageInput.addEventListener(
    "change",
    function() {

        const file =
            imageInput.files[0];

        if (!file) {
            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(event) {

                selectedImage =
                    event.target.result;

                previewImage.src =
                    selectedImage;

                preview.style.display =
                    "block";
            };

        reader.readAsDataURL(file);
    }
);


removeImageButton.addEventListener(
    "click",
    function() {

        selectedImage = null;

        imageInput.value = "";

        preview.style.display =
            "none";

        previewImage.src = "";
    }
);


async function mesajGonder() {

    const mesaj =
        input.value.trim();

    if (!mesaj && !selectedImage) {
        return;
    }


    if (mesaj) {

        mesajEkle(
            "Sen: " + mesaj,
            "user"
        );

    }


    if (selectedImage) {

        resimEkle(
            selectedImage
        );

    }


    const gonderilecekResim =
        selectedImage;


    input.value = "";

    selectedImage = null;

    imageInput.value = "";

    preview.style.display =
        "none";

    previewImage.src = "";


    const loading =
        document.createElement("div");

    loading.className =
        "message dmn";

    loading.textContent =
        englishEnabled
            ? "DMN is thinking..."
            : "DMN düşünüyor...";

    messages.appendChild(loading);

    messages.scrollTop =
        messages.scrollHeight;


    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            mesaj,

                        english:
                            englishEnabled,

                        codeMode:
                            kodIstegiMi(mesaj),

                        image:
                            gonderilecekResim

                    })
                }
            );


        const data =
            await response.json();


        loading.remove();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "DMN cevap veremedi."
            );
        }


        mesajEkle(
            "DMN: " + data.reply,
            "dmn"
        );


        if (voiceEnabled) {

            sesliOku(
                data.reply
            );

        }

    } catch (error) {

        loading.remove();

        mesajEkle(
            "DMN: " +
            error.message,
            "dmn"
        );

        console.error(
            "DMN hatası:",
            error
        );
    }
}


function seslendirilecekMetniTemizle(metin) {

    let temiz =
        metin;

    temiz =
        temiz.replace(
            /```[\s\S]*?```/g,
            " "
        );

    temiz =
        temiz.replace(
            /`[^`]*`/g,
            " "
        );

    temiz =
        temiz.replace(
            /https?:\/\/\S+/gi,
            " "
        );

    temiz =
        temiz.replace(
            /[\u{1F300}-\u{1FAFF}]/gu,
            " "
        );

    temiz =
        temiz.replace(
            /[\u{1F1E6}-\u{1F1FF}]/gu,
            " "
        );

    temiz =
        temiz.replace(
            /[\u2600-\u27BF]/g,
            " "
        );

    temiz =
        temiz.replace(
            /[#*_~]/g,
            " "
        );

    temiz =
        temiz.replace(
            /\s+/g,
            " "
        );

    return temiz.trim();
}


function sesliOku(metin) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    const temizMetin =
        seslendirilecekMetniTemizle(
            metin
        );


    if (!temizMetin) {
        return;
    }


    window.speechSynthesis.cancel();


    const sesler =
        window.speechSynthesis
            .getVoices();


    let secilenSes;


    if (englishEnabled) {

        secilenSes =
            sesler.find(
                ses =>
                    /^en[-_]/i.test(
                        ses.lang
                    )
            );

    } else {

        secilenSes =
            sesler.find(
                ses =>
                    ses.name.includes(
                        "Microsoft Tolga"
                    )
            )
            ||
            sesler.find(
                ses =>
                    /^tr[-_]/i.test(
                        ses.lang
                    )
            );
    }


    if (!secilenSes) {
        return;
    }


    const konusma =
        new SpeechSynthesisUtterance(
            temizMetin
        );


    konusma.voice =
        secilenSes;

    konusma.lang =
        englishEnabled
            ? "en-US"
            : "tr-TR";

    konusma.rate =
        0.95;

    konusma.pitch =
        0.9;

    konusma.volume =
        1;


    konusma.onstart =
        function() {

            statusText.textContent =
                englishEnabled
                    ? "🔊 Speaking English..."
                    : "🔊 Konuşuyor...";
        };


    konusma.onend =
        function() {

            ayarlariGuncelle();
        };


    konusma.onerror =
        function() {

            statusText.textContent =
                "Ses hatası";
        };


    window.speechSynthesis.speak(
        konusma
    );
}


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            micButton.classList.add(
                "recording"
            );

            micButton.textContent =
                "🔴";

            statusText.textContent =
                englishEnabled
                    ? "🎤 Listening..."
                    : "🎤 Dinliyorum...";
        };


    recognition.onend =
        function() {

            micButton.classList.remove(
                "recording"
            );

            micButton.textContent =
                "🎤";

            ayarlariGuncelle();
        };


    recognition.onerror =
        function(event) {

            console.error(
                "Mikrofon hatası:",
                event.error
            );

            micButton.classList.remove(
                "recording"
            );

            micButton.textContent =
                "🎤";

            statusText.textContent =
                "Mikrofon hatası";
        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript;

            input.value =
                text;

            mesajGonder();
        };

} else {

    micButton.disabled =
        true;
}


micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {
            return;
        }

        recognition.lang =
            englishEnabled
                ? "en-US"
                : "tr-TR";

        try {

            recognition.start();

        } catch (error) {

            console.log(error);

        }
    }
);


sendButton.addEventListener(
    "click",
    mesajGonder
);


input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            mesajGonder();
        }

    }
);


window.speechSynthesis.onvoiceschanged =
    function() {

        window.speechSynthesis
            .getVoices();

    };

</script>
