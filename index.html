<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMN</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f1117;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px 25px;
            background: #171a23;
            border-bottom: 1px solid #292e3a;
            font-size: 24px;
            font-weight: bold;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            max-width: 850px;
            margin: 12px auto;
            padding: 15px;
            border-radius: 12px;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .user {
            background: #252a36;
        }

        .dmn {
            background: #191e29;
            border: 1px solid #2b3240;
        }

        .input-area {
            padding: 18px;
            background: #171a23;
            border-top: 1px solid #292e3a;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #353c4b;
            background: #0f1117;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 0 18px;
            cursor: pointer;
            font-size: 20px;
        }

        button:hover {
            opacity: 0.85;
        }

        #micButton.recording {
            background: red;
            color: white;
        }

        .status {
            max-width: 850px;
            margin: 8px auto 0;
            color: #8f98aa;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    DMN 🤖
</header>

<div class="messages" id="messages">

    <div class="message dmn">
        Merhaba! Ben DMN. 🎤 Mikrofon düğmesine basarak konuşabilirsin.
    </div>

</div>

<div class="input-area">

    <div class="input-box">

        <button id="micButton" title="Sesli komut">
            🎤
        </button>

        <input
            id="messageInput"
            type="text"
            placeholder="DMN'ye bir şey sor..."
            autocomplete="off"
        >

        <button id="sendButton" title="Gönder">
            ➤
        </button>

    </div>

    <div class="status" id="status">
        Ses: Microsoft Tolga
    </div>

</div>

<script>

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const messages =
    document.getElementById("messages");

const statusText =
    document.getElementById("status");


// =====================================
// MESAJ EKLE
// =====================================

function mesajEkle(text, type) {

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent =
        text;

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


// =====================================
// DMN'YE MESAJ GÖNDER
// =====================================

async function mesajGonder() {

    const mesaj =
        input.value.trim();

    if (!mesaj) {
        return;
    }

    mesajEkle(
        "Sen: " + mesaj,
        "user"
    );

    input.value = "";

    const loading =
        document.createElement("div");

    loading.className =
        "message dmn";

    loading.textContent =
        "DMN düşünüyor...";

    messages.appendChild(loading);

    messages.scrollTop =
        messages.scrollHeight;

    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: mesaj
                    })
                }
            );


        const data =
            await response.json();

        loading.remove();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "DMN cevap veremedi."
            );
        }


        mesajEkle(
            "DMN: " + data.reply,
            "dmn"
        );


        // Microsoft Tolga ile seslendir
        sesliOku(data.reply);


    } catch (error) {

        loading.remove();

        mesajEkle(
            "DMN: " + error.message,
            "dmn"
        );

        console.error(
            "DMN hatası:",
            error
        );
    }
}


// =====================================
// MICROSOFT TOLGA SESİ
// =====================================

function sesliOku(metin) {

    if (!("speechSynthesis" in window)) {

        console.error(
            "Tarayıcı seslendirmeyi desteklemiyor."
        );

        return;
    }


    // Önce eski konuşmayı durdur
    window.speechSynthesis.cancel();


    // Kodları seslendirme
    const temizMetin =
        metin
            .replace(
                /```[\s\S]*?```/g,
                " Kod burada. "
            )
            .replace(
                /`[^`]*`/g,
                ""
            )
            .trim();


    if (!temizMetin) {
        return;
    }


    const sesler =
        window.speechSynthesis.getVoices();


    const tolga =
        sesler.find(
            ses =>
                ses.name ===
                "Microsoft Tolga - Turkish (Turkey)"
        );


    if (!tolga) {

        statusText.textContent =
            "Ses: Microsoft Tolga bulunamadı";

        console.error(
            "Microsoft Tolga sesi bulunamadı."
        );

        return;
    }


    const konusma =
        new SpeechSynthesisUtterance(
            temizMetin
        );


    konusma.voice =
        tolga;

    konusma.lang =
        "tr-TR";


    // Daha doğal konuşma
    konusma.rate =
        0.95;

    konusma.pitch =
        0.85;

    konusma.volume =
        1.0;


    konusma.onstart =
        function() {

            statusText.textContent =
                "🔊 Ses: Microsoft Tolga";

        };


    konusma.onend =
        function() {

            statusText.textContent =
                "Ses: Microsoft Tolga";

        };


    konusma.onerror =
        function(event) {

            console.error(
                "Seslendirme hatası:",
                event
            );

            statusText.textContent =
                "Ses hatası";
        };


    window.speechSynthesis.speak(
        konusma
    );
}


// =====================================
// TÜRKÇE SESLİ KOMUT
// =====================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            micButton.classList.add(
                "recording"
            );

            micButton.textContent =
                "🔴";

            statusText.textContent =
                "🎤 Dinliyorum...";
        };


    recognition.onend =
        function() {

            micButton.classList.remove(
                "recording"
            );

            micButton.textContent =
                "🎤";

            statusText.textContent =
                "Ses: Microsoft Tolga";
        };


    recognition.onerror =
        function(event) {

            console.error(
                "Mikrofon hatası:",
                event.error
            );

            micButton.classList.remove(
                "recording"
            );

            micButton.textContent =
                "🎤";

            statusText.textContent =
                "Mikrofon hatası";
        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript;


            input.value =
                text;


            mesajGonder();
        };

} else {

    micButton.disabled =
        true;

    statusText.textContent =
        "Sesli komut desteklenmiyor.";
}


// =====================================
// MİKROFON
// =====================================

micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {
            return;
        }

        try {

            recognition.start();

        } catch (error) {

            console.log(error);

        }
    }
);


// =====================================
// GÖNDER
// =====================================

sendButton.addEventListener(
    "click",
    mesajGonder
);


// =====================================
// ENTER
// =====================================

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            mesajGonder();

        }
    }
);


// =====================================
// SESLER YÜKLENDİĞİNDE
// =====================================

window.speechSynthesis.onvoiceschanged =
    function() {

        const sesler =
            window.speechSynthesis
                .getVoices();

        const tolga =
            sesler.find(
                ses =>
                    ses.name ===
                    "Microsoft Tolga - Turkish (Turkey)"
            );

        if (tolga) {

            statusText.textContent =
                "Ses: Microsoft Tolga";

        }
    };

</script>

</body>
</html>
