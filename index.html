<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DMN</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background:
        radial-gradient(circle at 10% 10%, rgba(90,70,180,.22), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(30,130,220,.16), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(120,40,180,.12), transparent 35%),
        #0b0d13;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

button,
input {
    font-family: inherit;
}

button {
    border: 0;
    cursor: pointer;
    color: white;
}

.app {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 280px;
    background: rgba(18,21,31,.92);
    border-right: 1px solid #292e3a;
    backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    padding: 15px;
    transition: .25s;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    padding: 10px;
    margin-bottom: 12px;
}

.new-chat {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    background: #252a36;
    text-align: left;
    font-size: 15px;
    margin-bottom: 15px;
}

.new-chat:hover,
.sidebar button:hover,
.icon-button:hover {
    background: #303746;
}

.chat-list {
    flex: 1;
    overflow-y: auto;
}

.chat-item {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 5px;
    cursor: pointer;
    color: #dce0e8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-item:hover {
    background: #242936;
}

.chat-item.active {
    background: #303645;
}

.sidebar-bottom {
    border-top: 1px solid #292e3a;
    padding-top: 10px;
}

.sidebar-button {
    width: 100%;
    background: transparent;
    text-align: left;
    padding: 12px;
    border-radius: 10px;
    font-size: 15px;
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

header {
    height: 64px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 18px;
    background: rgba(15,18,27,.75);
    border-bottom: 1px solid #292e3a;
    backdrop-filter: blur(18px);
}

.mobile-menu {
    display: none;
    background: transparent;
    font-size: 23px;
    margin-right: 10px;
}

.header-title {
    font-size: 21px;
    font-weight: bold;
}

.header-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
}

.icon-button {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #252a36;
    font-size: 19px;
}

.screen {
    flex: 1;
    min-height: 0;
}

#chatScreen {
    display: flex;
    flex-direction: column;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 18px 160px;
}

.message {
    max-width: 850px;
    margin: 12px auto;
    padding: 15px 17px;
    border-radius: 16px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #252a36;
}

.dmn {
    background: rgba(25,30,41,.9);
    border: 1px solid #303746;
}

.message-image {
    max-width: 100%;
    max-height: 500px;
    display: block;
    border-radius: 14px;
    margin-top: 10px;
}

.generated-image {
    width: 100%;
    max-width: 700px;
    border-radius: 14px;
    display: block;
    margin-top: 10px;
}

/* CODE */

.code-wrapper {
    margin-top: 12px;
    border: 1px solid #343b4a;
    border-radius: 12px;
    overflow: hidden;
    background: #0b0e14;
}

.code-header {
    height: 42px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #151924;
    color: #aeb6c7;
    font-size: 13px;
}

.copy-button {
    padding: 7px 11px;
    border-radius: 8px;
    background: #272d3a;
    font-size: 13px;
}

.copy-button:hover {
    background: #384052;
}

pre {
    margin: 0;
    padding: 15px;
    overflow-x: auto;
}

code {
    font-family: Consolas, monospace;
    font-size: 14px;
}

/* INPUT */

.input-area {
    position: absolute;
    bottom: 0;
    left: 280px;
    right: 0;
    padding: 15px 18px 20px;
    background: linear-gradient(
        transparent,
        rgba(11,13,19,.97) 25%
    );
}

.input-container {
    max-width: 850px;
    margin: auto;
}

.preview {
    display: none;
    margin-bottom: 8px;
    padding: 8px;
    border-radius: 12px;
    background: #171b25;
    width: fit-content;
}

.preview img {
    max-width: 130px;
    max-height: 90px;
    border-radius: 8px;
}

.input-box {
    display: flex;
    gap: 8px;
    padding: 8px;
    background: #171b25;
    border: 1px solid #303746;
    border-radius: 17px;
    box-shadow: 0 10px 35px rgba(0,0,0,.3);
}

.input-box input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    font-size: 16px;
    padding: 10px;
}

.input-box input::placeholder {
    color: #8992a4;
}

.input-button {
    width: 43px;
    height: 43px;
    border-radius: 12px;
    background: #252a36;
    font-size: 18px;
}

.send-button {
    background: #fff;
    color: #111;
}

.send-button:hover {
    background: #ddd;
}

.status {
    color: #858ea1;
    font-size: 12px;
    margin-top: 7px;
    text-align: center;
}

#imageInput,
#fileInput {
    display: none;
}

/* SETTINGS */

#settingsScreen {
    display: none;
    overflow-y: auto;
    padding: 35px 20px 120px;
}

.settings-box {
    max-width: 750px;
    margin: auto;
}

.settings-title {
    font-size: 29px;
    font-weight: bold;
    margin-bottom: 25px;
}

.setting {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 18px;
    margin-bottom: 14px;
    border: 1px solid #303746;
    border-radius: 15px;
    background: rgba(25,30,41,.9);
}

.setting-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.setting-description {
    color: #8992a4;
    font-size: 13px;
}

.switch {
    position: relative;
    width: 52px;
    height: 30px;
    flex-shrink: 0;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    inset: 0;
    background: #353c4b;
    border-radius: 30px;
}

.slider:before {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    left: 4px;
    top: 4px;
    background: white;
    border-radius: 50%;
    transition: .2s;
}

.switch input:checked + .slider {
    background: #4caf50;
}

.switch input:checked + .slider:before {
    transform: translateX(22px);
}

/* MOBILE */

@media (max-width: 700px) {

    .sidebar {
        position: fixed;
        z-index: 20;
        left: -290px;
        top: 0;
        bottom: 0;
    }

    .sidebar.open {
        left: 0;
    }

    .mobile-menu {
        display: block;
    }

    .input-area {
        left: 0;
    }

    .messages {
        padding-left: 10px;
        padding-right: 10px;
    }

    .message {
        margin: 9px 0;
    }
}
</style>
</head>

<body>

        </div>

        <button class="new-chat" id="newChatButton">

        </button>

        <div class="chat-list" id="chatList"></div>

        <div class="sidebar-bottom">

                class="sidebar-button"

            </button>

        </div>

    </aside>

    <main class="main">

        <header>

            <button
                class="mobile-menu"

            <div class="header-title">

            </div>

            </div>

        </div>

        <div

            <div class="settings-box">

                    ⚙️ DMN Ayarları

                <div class="setting">

                    <div>
                        <div class="setting-name">

                        <div class="setting-name">

                        <input
                            type="checkbox"

                    <div>
                        <div class="setting-name">

                        <div class="setting-description">

                        </div>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            checked
                            disabled>

                        <span class="slider"></span>

<script>

const messages =
    document.getElementById("messages");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const imageButton =
    document.getElementById("imageButton");

const imageInput =
    document.getElementById("imageInput");

const fileButton =
    document.getElementById("fileButton");

const fileInput =
    document.getElementById("fileInput");

const generateButton =
    document.getElementById("generateButton");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const statusText =
    document.getElementById("status");

const chatList =
    document.getElementById("chatList");

const sidebar =
    document.getElementById("sidebar");

const chatScreen =
    document.getElementById("chatScreen");

const settingsScreen =
    document.getElementById("settingsScreen");

const settingsButton =
    document.getElementById("settingsButton");

const headerSettingsButton =
    document.getElementById("headerSettingsButton");

const newChatButton =
    document.getElementById("newChatButton");

const mobileMenuButton =
    document.getElementById("mobileMenuButton");

const voiceToggle =
    document.getElementById("voiceToggle");

const englishToggle =
    document.getElementById("englishToggle");


let voiceEnabled =
    localStorage.getItem("dmn_voice") === "true";

let englishEnabled =
    localStorage.getItem("dmn_english") === "true";

let selectedImage = null;

let currentChatId = null;

let chats = [];

let recognition = null;


/* ================================
   AYARLAR
================================ */

voiceToggle.checked =
    voiceEnabled;

englishToggle.checked =
    englishEnabled;


function updateSettings() {

    voiceEnabled =
        voiceToggle.checked;

    englishEnabled =
        englishToggle.checked;

    localStorage.setItem(
        "dmn_voice",
        String(voiceEnabled)
    );

    localStorage.setItem(
        "dmn_english",
        String(englishEnabled)
    );

    statusText.textContent =
        voiceEnabled
            ? (
                englishEnabled
                    ? "🔊 Voice: English"
                    : "🔊 Sesli cevap: Açık"
            )
            : (
                englishEnabled
                    ? "🔊 Voice: Off | English"
                    : "🔊 Sesli cevap: Kapalı"
            );

    if (recognition) {
        recognition.lang =
            englishEnabled
                ? "en-US"
                : "tr-TR";
    }
}


voiceToggle.addEventListener(
    "change",
    updateSettings
);

englishToggle.addEventListener(
    "change",
    updateSettings
);

updateSettings();


/* ================================
   AYARLAR AÇ / KAPAT
================================ */

function toggleSettings() {

    const settingsOpen =
        settingsScreen.style.display === "block";

    if (settingsOpen) {

        settingsScreen.style.display =
            "none";

        chatScreen.style.display =
            "flex";

    } else {

        settingsScreen.style.display =
            "block";

        chatScreen.style.display =
            "none";
    }

    sidebar.classList.remove("open");
}


settingsButton.addEventListener(
    "click",
    toggleSettings
);

headerSettingsButton.addEventListener(
    "click",
    toggleSettings
);


/* ================================
   YENİ SOHBET
================================ */

function yeniSohbet() {

    currentChatId =
        "chat_" +
        Date.now();

    messages.innerHTML = "";

    const welcome =
        englishEnabled
            ? "Hello! I'm DMN. 🤖\nAsk me anything."
            : "Merhaba! Ben DMN. 🤖\nBana istediğin şeyi sorabilirsin.";

    mesajEkle(
        welcome,
        "dmn"
    );

    saveCurrentChat();

    renderChatList();

    sidebar.classList.remove("open");

    settingsScreen.style.display =
        "none";

    chatScreen.style.display =
        "flex";
}


newChatButton.addEventListener(
    "click",
    yeniSohbet
);


/* ================================
   MESAJ
================================ */

function mesajEkle(text, type) {

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent =
        text;

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


/* ================================
   GÖRSEL MESAJ
================================ */

function resimEkle(src, type = "user") {

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    const img =
        document.createElement("img");

    img.src = src;

    img.className =
        "message-image";

    div.appendChild(img);

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


/* ================================
   KODLARI KOPYALANABİLİR YAP
================================ */

function formatReply(text) {

    const container =
        document.createElement("div");

    const regex =
        /```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g;

    let lastIndex = 0;

    let match;

    while ((match = regex.exec(text)) !== null) {

        const before =
            text.slice(
                lastIndex,
                match.index
            );

        if (before) {
            container.appendChild(
                document.createTextNode(before)
            );
        }

        const language =
            match[1] || "code";

        const code =
            match[2].trim();

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "code-wrapper";

        const header =
            document.createElement("div");

        header.className =
            "code-header";

        const lang =
            document.createElement("span");

        lang.textContent =
            language;

        const copy =
            document.createElement("button");

        copy.className =
            "copy-button";

        copy.textContent =
            "Kopyala";

        copy.addEventListener(
            "click",
            async function() {

                try {

                    await navigator.clipboard.writeText(
                        code
                    );

                    copy.textContent =
                        "Kopyalandı";

                    setTimeout(
                        () => {
                            copy.textContent =
                                "Kopyala";
                        },
                        1500
                    );

                } catch (error) {

                    copy.textContent =
                        "Kopyalanamadı";
                }
            }
        );

        header.appendChild(lang);
        header.appendChild(copy);

        const pre =
            document.createElement("pre");

        const codeElement =
            document.createElement("code");

        codeElement.textContent =
            code;

        pre.appendChild(codeElement);

        wrapper.appendChild(header);
        wrapper.appendChild(pre);

        container.appendChild(wrapper);

        lastIndex =
            regex.lastIndex;
    }

    const after =
        text.slice(lastIndex);

    if (after) {

        container.appendChild(
            document.createTextNode(after)
        );
    }

    return container;
}


/* ================================
   DMN MESAJI
================================ */

function dmnMesajiEkle(text) {

    const div =
        document.createElement("div");

    div.className =
        "message dmn";

    const formatted =
        formatReply(text);

    div.appendChild(formatted);

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


/* ================================
   KOD İSTEĞİ
================================ */

function kodIstegiMi(mesaj) {

    const text =
        mesaj.toLowerCase();

    const words = [

        "kod ver",
        "kodu ver",
        "kod yaz",
        "kodu yaz",
        "kod oluştur",
        "kod olustur",
        "kod yap",
        "program yaz",
        "program oluştur",
        "program olustur",
        "arduino kodu",
        "esp32 kodu"
    ];

    return words.some(
        word =>
            text.includes(word)
    );
}


/* ================================
   RESİM İSTEĞİ
================================ */

function resimIstegiMi(mesaj) {

    const text =
        mesaj.toLowerCase();

    const words = [

        "resim oluştur",
        "resim olustur",
        "resim yap",
        "fotoğraf oluştur",
        "fotoğraf olustur",
        "görsel oluştur",
        "gorsel oluştur",
        "görsel yap",
        "bir resim çiz",
        "resim çiz"
    ];

    return words.some(
        word =>
            text.includes(word)
    );
}


/* ================================
   FOTOĞRAF
================================ */

imageButton.addEventListener(
    "click",
    () => imageInput.click()
);


imageInput.addEventListener(
    "change",
    function() {

        const file =
            imageInput.files[0];

        if (!file) {
            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(event) {

                selectedImage =
                    event.target.result;

                previewImage.src =
                    selectedImage;

                preview.style.display =
                    "block";
            };

        reader.readAsDataURL(file);
    }
);


/* ================================
   DOSYA
================================ */

fileButton.addEventListener(
    "click",
    () => fileInput.click()
);


fileInput.addEventListener(
    "change",
    function() {

        const file =
            fileInput.files[0];

        if (!file) {
            return;
        }

        if (file.type.startsWith("image/")) {

            const reader =
                new FileReader();

            reader.onload =
                function(event) {

                    selectedImage =
                        event.target.result;

                    previewImage.src =
                        selectedImage;

                    preview.style.display =
                        "block";
                };

            reader.readAsDataURL(file);

        } else {

            input.value =
                "Dosya: " + file.name;
        }
    }
);


/* ================================
   GÖRSEL OLUŞTUR
================================ */

generateButton.addEventListener(
    "click",
    async function() {

        const prompt =
            input.value.trim();

        if (!prompt) {

            input.focus();

            return;
        }

        input.value = "";

        mesajEkle(
            "Sen: 🎨 " + prompt,
            "user"
        );

        const loading =
            document.createElement("div");

        loading.className =
            "message dmn";

        loading.textContent =
            "🎨 Görsel oluşturuluyor...";

        messages.appendChild(loading);

        try {

            const response =
                await fetch(
                    "/api/image",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                prompt
                            })
                    }
                );

            const data =
                await response.json();

            loading.remove();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Görsel oluşturulamadı."
                );
            }

            const div =
                document.createElement("div");

            div.className =
                "message dmn";

            const text =
                document.createElement("div");

            text.textContent =
                "🎨 Oluşturduğum görsel:";

            const img =
                document.createElement("img");

            img.src =
                data.image;

            img.className =
                "generated-image";

            div.appendChild(text);
            div.appendChild(img);

            messages.appendChild(div);

            messages.scrollTop =
                messages.scrollHeight;

            saveCurrentChat();

        } catch (error) {

            loading.remove();

            mesajEkle(
                "DMN: " + error.message,
                "dmn"
            );
        }
    }
);


/* ================================
   MESAJ GÖNDER
================================ */

async function mesajGonder() {

    const mesaj =
        input.value.trim();

    if (!mesaj && !selectedImage) {
        return;
    }

    if (mesaj) {

        mesajEkle(
            "Sen: " + mesaj,
            "user"
        );
    }

    let gonderilecekResim =
        selectedImage;

    if (selectedImage) {

        resimEkle(
            selectedImage,
            "user"
        );
    }

    input.value = "";

    selectedImage = null;

    imageInput.value = "";

    fileInput.value = "";

    preview.style.display =
        "none";

    previewImage.src = "";

    const loading =
        document.createElement("div");

    loading.className =
        "message dmn";

    loading.textContent =
        englishEnabled
            ? "DMN is thinking..."
            : "DMN düşünüyor...";

    messages.appendChild(loading);

    messages.scrollTop =
        messages.scrollHeight;

    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                mesaj,

                            english:
                                englishEnabled,

                            codeMode:
                                kodIstegiMi(mesaj),

                            image:
                                gonderilecekResim
                        })
                }
            );

        const data =
            await response.json();

        loading.remove();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "DMN cevap veremedi."
            );
        }

        dmnMesajiEkle(
            data.reply
        );

        saveCurrentChat();

        if (voiceEnabled) {

            sesliOku(
                data.reply
            );
        }

    } catch (error) {

        loading.remove();

        mesajEkle(
            "DMN: " +
            error.message,
            "dmn"
        );

        console.error(
            "DMN HATASI:",
            error
        );
    }
}


/* ================================
   EMOJİLERİ SESLENDİRME
================================ */

function seslendirilecekMetniTemizle(metin) {

    let temiz =
        metin;

    temiz =
        temiz.replace(
            /```[\s\S]*?```/g,
            " "
        );

    temiz =
        temiz.replace(
            /`[^`]*`/g,
            " "
        );

    temiz =
        temiz.replace(
            /https?:\/\/\S+/gi,
            " "
        );

    temiz =
        temiz.replace(
            /[\u{1F300}-\u{1FAFF}]/gu,
            " "
        );

    temiz =
        temiz.replace(
            /[\u{1F1E6}-\u{1F1FF}]/gu,
            " "
        );

    temiz =
        temiz.replace(
            /[\u2600-\u27BF]/g,
            " "
        );

    temiz =
        temiz.replace(
            /[#*_~]/g,
            " "
        );

    temiz =
        temiz.replace(
            /\s+/g,
            " "
        );

    return temiz.trim();
}


/* ================================
   SESLİ CEVAP
================================ */

function sesliOku(metin) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    const temiz =
        seslendirilecekMetniTemizle(
            metin
        );

    if (!temiz) {
        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            temiz
        );

    utterance.lang =
        englishEnabled
            ? "en-US"
            : "tr-TR";

    utterance.rate =
        0.95;

    utterance.pitch =
        1;

    utterance.volume =
        1;

    const voices =
        window.speechSynthesis.getVoices();

    let voice =
        voices.find(
            v =>
                englishEnabled
                    ? /^en[-_]/i.test(v.lang)
                    : /^tr[-_]/i.test(v.lang)
        );

    if (voice) {
        utterance.voice =
            voice;
    }

    utterance.onstart =
        function() {

            statusText.textContent =
                englishEnabled
                    ? "🔊 Speaking..."
                    : "🔊 Konuşuyor...";
        };

    utterance.onend =
        function() {

            updateSettings();
        };

    utterance.onerror =
        function() {

            statusText.textContent =
                "Ses kullanılamadı.";
        };

    window.speechSynthesis.speak(
        utterance
    );
}


/* ================================
   MİKROFON
================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.onstart =
        function() {

            micButton.classList.add(
                "recording"
            );

            micButton.textContent =
                "🔴";

            statusText.textContent =
                englishEnabled
                    ? "🎤 Listening..."
                    : "🎤 Dinliyorum...";
        };

    recognition.onend =
        function() {

            micButton.classList.remove(
                "recording"
            );

            micButton.textContent =
                "🎤";

            updateSettings();
        };

    recognition.onerror =
        function(event) {

            console.error(
                "Mikrofon:",
                event.error
            );

            micButton.classList.remove(
                "recording"
            );

            micButton.textContent =
                "🎤";

            statusText.textContent =
                "Mikrofon kullanılamadı.";
        };

    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript;

            input.value =
                text;

            mesajGonder();
        };

} else {

    micButton.disabled =
        true;

    micButton.title =
        "Bu tarayıcı sesli komutu desteklemiyor.";
}


micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {
            return;
        }

        recognition.lang =
            englishEnabled
                ? "en-US"
                : "tr-TR";

        try {

            recognition.start();

        } catch (error) {

            console.log(error);
        }
    }
);


/* ================================
   ENTER
================================ */

sendButton.addEventListener(
    "click",
    mesajGonder
);

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            mesajGonder();
        }
    }
);


/* ================================
   SOHBET KAYDET
================================ */

async function saveCurrentChat() {

    if (!currentChatId) {

        currentChatId =
            "chat_" + Date.now();
    }

    const firstUser =
        messages.querySelector(".user");

    let title =
        firstUser
            ? firstUser.textContent
            : "Yeni sohbet";

    title =
        title
            .replace(/^Sen:\s*/, "")
            .trim()
            .slice(0, 40);

    if (!title) {
        title = "Yeni sohbet";
    }

    const chat = {

        id:
            currentChatId,

        title:
            title,

        html:
            messages.innerHTML,

        updatedAt:
            Date.now()
    };

    try {

        await fetch(
            "/api/chats",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(chat)
            }
        );

        await loadChats();

    } catch (error) {

        console.error(
            "Sohbet kaydedilemedi:",
            error
        );
    }
}


/* ================================
   SOHBETLERİ YÜKLE
================================ */

async function loadChats() {

    try {

        const response =
            await fetch(
                "/api/chats"
            );

        const data =
            await response.json();

        chats =
            data.chats || [];

        renderChatList();

    } catch (error) {

        console.error(
            "Sohbetler yüklenemedi:",
            error
        );
    }
}


/* ================================
   SOHBET LİSTESİ
================================ */

function renderChatList() {

    chatList.innerHTML = "";

    chats.forEach(
        chat => {

            const item =
                document.createElement("div");

            item.className =
                "chat-item" +
                (
                    chat.id === currentChatId
                        ? " active"
                        : ""
                );

            item.textContent =
                chat.title ||
                "Sohbet";

            item.addEventListener(
                "click",
                function() {

                    openChat(chat);

                    sidebar.classList.remove(
                        "open"
                    );
                }
            );

            chatList.appendChild(item);
        }
    );
}


/* ================================
   SOHBET AÇ
================================ */

function openChat(chat) {

    currentChatId =
        chat.id;

    messages.innerHTML =
        chat.html || "";

    settingsScreen.style.display =
        "none";

    chatScreen.style.display =
        "flex";

    messages.scrollTop =
        messages.scrollHeight;

    renderChatList();
}


/* ================================
   MOBİL MENÜ
================================ */

mobileMenuButton.addEventListener(
    "click",
    function() {

        sidebar.classList.toggle(
            "open"
        );
    }
);


/* ================================
   İLK AÇILIŞ
================================ */

async function init() {

    await loadChats();

    if (chats.length > 0) {

        openChat(
            chats[0]
        );

    } else {

        yeniSohbet();
    }
}


window.speechSynthesis.onvoiceschanged =
    function() {

        window.speechSynthesis.getVoices();
    };


init();

</script>
