<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="mBO_SXlln8r7ot4GJeNZK81rDS11GLJPQZbGsy6jHCQ">

    <title>DMN</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at 20% 10%, #26345f 0, transparent 35%),
                radial-gradient(circle at 90% 20%, #40275f 0, transparent 35%),
                linear-gradient(135deg, #0b1020, #151525 50%, #0b1020);
            height: 100vh;
            overflow: hidden;
        }

        header {
            height: 65px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            background: rgba(15, 18, 32, 0.82);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        #settingsButton {
            margin-left: auto;
        }

        button {
            border: 0;
            color: white;
            background: rgba(255,255,255,.09);
            border-radius: 12px;
            padding: 11px 15px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background: rgba(255,255,255,.16);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #chatScreen {
            height: calc(100vh - 65px);
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px 15px;
        }

        .message {
            max-width: 850px;
            margin: 12px auto;
            padding: 15px 17px;
            border-radius: 18px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background: rgba(255,255,255,.09);
        }

        .dmn {
            background: rgba(20,25,43,.82);
            border: 1px solid rgba(255,255,255,.08);
        }

        .message-image {
            max-width: 100%;
            max-height: 500px;
            border-radius: 15px;
            display: block;
            margin-top: 8px;
        }

        .code-wrapper {
            position: relative;
            margin-top: 10px;
        }

        .code-block {
            background: #080b12;
            border: 1px solid #30384d;
            border-radius: 12px;
            padding: 45px 15px 15px;
            overflow-x: auto;
            white-space: pre;
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        .copy-button {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 13px;
            padding: 7px 10px;
        }

        .voice-circle {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 7px;
            background: #7c8cff;
            box-shadow: 0 0 12px #7c8cff;
            animation: voicePulse 1s infinite alternate;
        }

        @keyframes voicePulse {
            from {
                transform: scale(.75);
                opacity: .55;
            }
            to {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .input-area {
            padding: 15px;
            background: rgba(10,13,25,.82);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,.08);
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            display: flex;
            gap: 8px;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #343b50;
            border-radius: 14px;
            background: rgba(5,8,17,.8);
            color: white;
            outline: none;
            font-size: 16px;
        }

        #messageInput:focus {
            border-color: #6978ff;
        }

        #imageInput {
            display: none;
        }

        .status {
            max-width: 850px;
            margin: 8px auto 0;
            color: #9aa3b8;
            font-size: 13px;
        }

        .preview {
            max-width: 850px;
            margin: 8px auto;
            display: none;
        }

        .preview img {
            max-width: 160px;
            max-height: 110px;
            border-radius: 12px;
        }

        #settingsScreen {
            display: none;
            height: calc(100vh - 65px);
            overflow-y: auto;
            padding: 25px 15px;
        }

        .settings-box {
            max-width: 700px;
            margin: auto;
        }

        .settings-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 22px;
        }

        .setting {
            padding: 18px;
            margin-bottom: 14px;
            background: rgba(20,25,43,.8);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .setting-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .setting-description {
            color: #949db0;
            font-size: 13px;
        }

        .switch {
            position: relative;
            width: 52px;
            height: 30px;
            flex-shrink: 0;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #343b50;
            border-radius: 30px;
            cursor: pointer;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            left: 4px;
            top: 4px;
            background: white;
            border-radius: 50%;
            transition: .2s;
        }

        .switch input:checked + .slider {
            background: #5969ff;
        }

        .switch input:checked + .slider::before {
            transform: translateX(22px);
        }

        .history-title {
            margin-top: 30px;
            font-size: 20px;
            font-weight: bold;
        }

        .history-item {
            padding: 13px;
            margin-top: 8px;
            border-radius: 12px;
            background: rgba(255,255,255,.06);
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item:hover {
            background: rgba(255,255,255,.11);
        }

        @media (max-width: 600px) {
            .message {
                max-width: 96%;
            }

            .input-box button {
                padding: 10px 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">DMN 🤖</div>
    <button id="settingsButton" title="Ayarlar">⚙️</button>
</header>

<div id="chatScreen">

    <div class="messages" id="messages">
        <div class="message dmn">
            Merhaba! Ben DMN. 🤖
            Bana istediğin şeyi sorabilirsin.
        </div>
    </div>

    <div class="preview" id="preview">
        <img id="previewImage" alt="Seçilen fotoğraf">
        <button id="removeImageButton">✕</button>
    </div>

    <div class="input-area">

        <div class="input-box">

            <button id="imageButton" title="Fotoğraf ekle">📷</button>

            <input
                id="imageInput"
                type="file"
                accept="image/*"
            >

            <button id="micButton" title="Sesli komut">🎤</button>

            <input
                id="messageInput"
                type="text"
                placeholder="DMN'ye bir şey sor..."
                autocomplete="off"
            >

            <button id="sendButton" title="Gönder">➤</button>

        </div>

        <div class="status" id="status">
            🔊 Sesli cevap: Kapalı
        </div>

    </div>
</div>

<div id="settingsScreen">

    <div class="settings-box">

        <div class="settings-title">
            ⚙️ DMN Ayarları
        </div>

        <div class="setting">
            <div>
                <div class="setting-name">🔊 Sesli cevap</div>
                <div class="setting-description">
                    DMN cevaplarını sesli okur.
                </div>
            </div>

            <label class="switch">
                <input type="checkbox" id="voiceToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting">
            <div>
                <div class="setting-name">🇬🇧 İngilizce</div>
                <div class="setting-description">
                    DMN İngilizce cevap verir.
                </div>
            </div>

            <label class="switch">
                <input type="checkbox" id="englishToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting">
            <div>
                <div class="setting-name">💬 Sohbet modu</div>
                <div class="setting-description">
                    Doğal sohbet modu sürekli açıktır.
                </div>
            </div>

            <label class="switch">
                <input type="checkbox" checked disabled>
                <span class="slider"></span>
            </label>
        </div>

        <div class="history-title">
            🕘 Sohbetler
        </div>

        <div id="historyList"></div>

        <button id="clearHistoryButton" style="margin-top:15px;">
            🗑️ Sohbet geçmişini temizle
        </button>

    </div>
</div>

<script>
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");
const imageButton = document.getElementById("imageButton");
const imageInput = document.getElementById("imageInput");
const removeImageButton = document.getElementById("removeImageButton");
const preview = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");
const messages = document.getElementById("messages");
const statusText = document.getElementById("status");

const chatScreen = document.getElementById("chatScreen");
const settingsScreen = document.getElementById("settingsScreen");

const settingsButton = document.getElementById("settingsButton");
const voiceToggle = document.getElementById("voiceToggle");
const englishToggle = document.getElementById("englishToggle");

const historyList = document.getElementById("historyList");
const clearHistoryButton = document.getElementById("clearHistoryButton");

let voiceEnabled =
    localStorage.getItem("dmn_voice") === "true";

let englishEnabled =
    localStorage.getItem("dmn_english") === "true";

let selectedImage = null;

let currentConversation = JSON.parse(
    localStorage.getItem("dmn_current_conversation") || "[]"
);

voiceToggle.checked = voiceEnabled;
englishToggle.checked = englishEnabled;

function ayarlariGuncelle() {
    voiceEnabled = voiceToggle.checked;
    englishEnabled = englishToggle.checked;

    localStorage.setItem("dmn_voice", voiceEnabled);
    localStorage.setItem("dmn_english", englishEnabled);

    if (voiceEnabled) {
        statusText.innerHTML = englishEnabled
            ? "🔊 Voice: English"
            : "🔊 Sesli cevap: Açık";
    } else {
        statusText.innerHTML = englishEnabled
            ? "🔊 Voice: Off"
            : "🔊 Sesli cevap: Kapalı";
    }
}

voiceToggle.addEventListener("change", ayarlariGuncelle);
englishToggle.addEventListener("change", ayarlariGuncelle);

settingsButton.addEventListener("click", function() {
    const open = settingsScreen.style.display === "block";

    if (open) {
        settingsScreen.style.display = "none";
        chatScreen.style.display = "flex";
    } else {
        settingsScreen.style.display = "block";
        chatScreen.style.display = "none";
        sohbetleriGoster();
    }
});

function mesajEkle(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function resimEkle(src, type = "user") {
    const div = document.createElement("div");
    div.className = "message " + type;

    const img = document.createElement("img");
    img.src = src;
    img.className = "message-image";

    div.appendChild(img);
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function kodIstegiMi(text) {
    const lower = text.toLowerCase();

    const words = [
        "kod ver",
        "kodu ver",
        "kod yaz",
        "kodu yaz",
        "kod oluştur",
        "kod olustur",
        "kod yap",
        "program yaz",
        "program oluştur",
        "program olustur"
    ];

    return words.some(word => lower.includes(word));
}

function resimIstegiMi(text) {
    const lower = text.toLowerCase();

    const words = [
        "resim oluştur",
        "resim olustur",
        "resim yap",
        "fotoğraf oluştur",
        "fotoğraf olustur",
        "görsel oluştur",
        "gorsel olustur",
        "resim çiz",
        "resim ciz"
    ];

    return words.some(word => lower.includes(word));
}

imageButton.addEventListener("click", function() {
    imageInput.click();
});

imageInput.addEventListener("change", function() {
    const file = imageInput.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {
        selectedImage = event.target.result;
        previewImage.src = selectedImage;
        preview.style.display = "block";
    };

    reader.readAsDataURL(file);
});

removeImageButton.addEventListener("click", function() {
    selectedImage = null;
    imageInput.value = "";
    preview.style.display = "none";
    previewImage.src = "";
});

async function mesajGonder() {
    const mesaj = input.value.trim();

    if (!mesaj && !selectedImage) {
        return;
    }

    const gonderilecekResim = selectedImage;

    if (mesaj) {
        mesajEkle("Sen: " + mesaj, "user");
    }

    if (gonderilecekResim) {
        resimEkle(gonderilecekResim);
    }

    currentConversation.push({
        role: "user",
        text: mesaj,
        image: gonderilecekResim
    });

    sohbetiKaydet();

    input.value = "";
    selectedImage = null;
    imageInput.value = "";
    preview.style.display = "none";
    previewImage.src = "";

    const loading = document.createElement("div");
    loading.className = "message dmn";
    loading.textContent = englishEnabled
        ? "DMN is thinking..."
        : "DMN düşünüyor...";

    messages.appendChild(loading);
    messages.scrollTop = messages.scrollHeight;

    try {
        if (!gonderilecekResim && mesaj && resimIstegiMi(mesaj)) {
            const response = await fetch("/api/generate-image", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    prompt: mesaj
                })
            });

            const data = await response.json();

            loading.remove();

            if (!response.ok) {
                throw new Error(
                    data.error || "Görsel oluşturulamadı."
                );
            }

            if (data.image) {
                mesajEkle(
                    englishEnabled
                        ? "DMN: Here is your image."
                        : "DMN: Görselini oluşturdum.",
                    "dmn"
                );

                resimEkle(data.image, "dmn");

                currentConversation.push({
                    role: "assistant",
                    text: englishEnabled
                        ? "Here is your image."
                        : "Görselini oluşturdum.",
                    image: data.image
                });

                sohbetiKaydet();
            }

            return;
        }

        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: mesaj,
                english: englishEnabled,
                codeMode: kodIstegiMi(mesaj),
                image: gonderilecekResim
            })
        });

        const data = await response.json();

        loading.remove();

        if (!response.ok) {
            throw new Error(
                data.error || "DMN cevap veremedi."
            );
        }

        cevapEkle(data.reply);

        currentConversation.push({
            role: "assistant",
            text: data.reply,
            image: null
        });

        sohbetiKaydet();

        if (voiceEnabled) {
            sesliOku(data.reply);
        }

    } catch (error) {
        loading.remove();

        mesajEkle(
            "DMN: " + error.message,
            "dmn"
        );

        console.error("DMN hatası:", error);
    }
}

function cevapEkle(text) {
    const div = document.createElement("div");
    div.className = "message dmn";

    const parts = text.split(/(```[\s\S]*?```)/g);

    parts.forEach(part => {
        if (part.startsWith("```")) {
            let code = part
                .replace(/^```[a-zA-Z0-9_-]*\n?/, "")
                .replace(/```$/, "")
                .trim();

            const wrapper = document.createElement("div");
            wrapper.className = "code-wrapper";

            const copy = document.createElement("button");
            copy.className = "copy-button";
            copy.textContent = "📋 Kopyala";

            copy.addEventListener("click", async function() {
                try {
                    await navigator.clipboard.writeText(code);
                    copy.textContent = "✅ Kopyalandı";

                    setTimeout(function() {
                        copy.textContent = "📋 Kopyala";
                    }, 1500);
                } catch {
                    copy.textContent = "Kopyalanamadı";
                }
            });

            const codeBlock = document.createElement("div");
            codeBlock.className = "code-block";
            codeBlock.textContent = code;

            wrapper.appendChild(copy);
            wrapper.appendChild(codeBlock);
            div.appendChild(wrapper);

        } else if (part.trim()) {
            const textNode = document.createElement("div");
            textNode.textContent = part;
            div.appendChild(textNode);
        }
    });

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function temizSesMetni(text) {
    return text
        .replace(/```[\s\S]*?```/g, " ")
        .replace(/`[^`]*`/g, " ")
        .replace(/https?:\/\/\S+/gi, " ")
        .replace(/[\u{1F300}-\u{1FAFF}]/gu, " ")
        .replace(/[\u{1F1E6}-\u{1F1FF}]/gu, " ")
        .replace(/[\u2600-\u27BF]/g, " ")
        .replace(/[#*_~]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function uygunSesBul() {
    const voices = speechSynthesis.getVoices();

    if (!voices.length) {
        return null;
    }

    if (englishEnabled) {
        return voices.find(v =>
            /^en(-|_)/i.test(v.lang)
        ) || voices.find(v =>
            /English/i.test(v.name)
        );
    }

    return voices.find(v =>
        /^tr(-|_)/i.test(v.lang)
    ) || voices.find(v =>
        /Turkish|Türkçe/i.test(v.name)
    );
}

function sesliOku(text) {
    if (!("speechSynthesis" in window)) {
        return;
    }

    const temiz = temizSesMetni(text);

    if (!temiz) {
        return;
    }

    speechSynthesis.cancel();

    const voice = uygunSesBul();

    const utterance =
        new SpeechSynthesisUtterance(temiz);

    utterance.lang =
        englishEnabled ? "en-US" : "tr-TR";

    if (voice) {
        utterance.voice = voice;
    }

    utterance.rate = .95;
    utterance.pitch = 1;
    utterance.volume = 1;

    utterance.onstart = function() {
        statusText.innerHTML =
            '<span class="voice-circle"></span>' +
            (englishEnabled
                ? "Speaking..."
                : "Konuşuyor...");
    };

    utterance.onend = function() {
        ayarlariGuncelle();
    };

    utterance.onerror = function() {
        ayarlariGuncelle();
    };

    speechSynthesis.speak(utterance);
}

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();

    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function() {
        micButton.textContent = "🔴";

        statusText.textContent =
            englishEnabled
                ? "🎤 Listening..."
                : "🎤 Dinliyorum...";
    };

    recognition.onend = function() {
        micButton.textContent = "🎤";
        ayarlariGuncelle();
    };

    recognition.onerror = function(event) {
        console.error(
            "Mikrofon hatası:",
            event.error
        );

        micButton.textContent = "🎤";
        ayarlariGuncelle();
    };

    recognition.onresult = function(event) {
        const text =
            event.results[0][0].transcript;

        input.value = text;

        mesajGonder();
    };
} else {
    micButton.disabled = true;
}

micButton.addEventListener("click", function() {
    if (!recognition) {
        return;
    }

    recognition.lang =
        englishEnabled
            ? "en-US"
            : "tr-TR";

    try {
        recognition.start();
    } catch (error) {
        console.log(error);
    }
});

sendButton.addEventListener(
    "click",
    mesajGonder
);

input.addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            mesajGonder();
        }
    }
);

function sohbetiKaydet() {
    localStorage.setItem(
        "dmn_current_conversation",
        JSON.stringify(currentConversation)
    );

    let history = JSON.parse(
        localStorage.getItem("dmn_history") || "[]"
    );

    if (currentConversation.length === 0) {
        return;
    }

    const firstUser = currentConversation.find(
        item => item.role === "user" && item.text
    );

    const title = firstUser
        ? firstUser.text.substring(0, 45)
        : "Yeni sohbet";

    history = history.filter(
        item => item.id !== "current"
    );

    history.unshift({
        id: "current",
        title: title,
        messages: currentConversation
    });

    localStorage.setItem(
        "dmn_history",
        JSON.stringify(history)
    );
}

function sohbetleriGoster() {
    historyList.innerHTML = "";

    const history = JSON.parse(
        localStorage.getItem("dmn_history") || "[]"
    );

    if (!history.length) {
        historyList.innerHTML =
            '<div class="history-item">Henüz kayıtlı sohbet yok.</div>';
        return;
    }

    history.forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.textContent = item.title;

        div.addEventListener("click", function() {
            currentConversation = item.messages || [];

            messages.innerHTML = "";

            currentConversation.forEach(msg => {
                if (msg.text) {
                    mesajEkle(
                        msg.role === "user"
                            ? "Sen: " + msg.text
                            : "DMN: " + msg.text,
                        msg.role === "user"
                            ? "user"
                            : "dmn"
                    );
                }

                if (msg.image) {
                    resimEkle(
                        msg.image,
                        msg.role === "user"
                            ? "user"
                            : "dmn"
                    );
                }
            });

            settingsScreen.style.display = "none";
            chatScreen.style.display = "flex";
        });

        historyList.appendChild(div);
    });
}

clearHistoryButton.addEventListener(
    "click",
    function() {
        localStorage.removeItem("dmn_history");
        localStorage.removeItem(
            "dmn_current_conversation"
        );

        currentConversation = [];

        messages.innerHTML =
            '<div class="message dmn">Merhaba! Ben DMN. 🤖</div>';

        sohbetleriGoster();
    }
);

if ("speechSynthesis" in window) {
    speechSynthesis.onvoiceschanged = function() {
        speechSynthesis.getVoices();
    };
}

ayarlariGuncelle();
sohbetiKaydet();
</script>

</body>
</html>
