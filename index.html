<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>DMN 🤖</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 20% 10%,
            #26345f 0,
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 20%,
            #40275f 0,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #0b1020,
            #151525 50%,
            #0b1020
        );

    height: 100vh;

    overflow: hidden;
}

/* HEADER */

header {

    height: 65px;

    display: flex;

    align-items: center;

    padding: 0 18px;

    background:
        rgba(15,18,32,.82);

    backdrop-filter:
        blur(15px);

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.logo {

    font-size: 23px;

    font-weight: bold;
}

#settingsButton {

    margin-left: auto;
}

/* BUTTON */

button {

    border: 0;

    color: white;

    background:
        rgba(255,255,255,.09);

    border-radius: 12px;

    padding: 11px 15px;

    cursor: pointer;

    font-size: 18px;
}

button:hover {

    background:
        rgba(255,255,255,.16);
}

/* CHAT */

#chatScreen {

    height:
        calc(100vh - 65px);

    display: flex;

    flex-direction: column;
}

.messages {

    flex: 1;

    overflow-y: auto;

    padding: 25px 15px;
}

.message {

    max-width: 850px;

    margin: 12px auto;

    padding: 15px 17px;

    border-radius: 18px;

    line-height: 1.55;

    white-space: pre-wrap;

    overflow-wrap: anywhere;
}

.user {

    background:
        rgba(255,255,255,.09);
}

.dmn {

    background:
        rgba(20,25,43,.82);

    border:
        1px solid rgba(255,255,255,.08);
}

/* CODE */

.code-wrapper {

    position: relative;

    margin-top: 10px;
}

.code-block {

    background: #080b12;

    border:
        1px solid #30384d;

    border-radius: 12px;

    padding:
        45px 15px 15px;

    overflow-x: auto;

    white-space: pre;

    font-family:
        Consolas,
        monospace;

    font-size: 14px;
}

.copy-button {

    position: absolute;

    top: 8px;

    right: 8px;

    font-size: 13px;

    padding:
        7px 10px;
}

/* INPUT */

.input-area {

    padding: 15px;

    background:
        rgba(10,13,25,.82);

    backdrop-filter:
        blur(15px);

    border-top:
        1px solid rgba(255,255,255,.08);
}

.input-box {

    max-width: 850px;

    margin: auto;

    display: flex;

    gap: 8px;
}

#messageInput {

    flex: 1;

    min-width: 0;

    padding: 14px;

    border:
        1px solid #343b50;

    border-radius: 14px;

    background:
        rgba(5,8,17,.8);

    color: white;

    outline: none;

    font-size: 16px;
}

#messageInput:focus {

    border-color:
        #6978ff;
}

.status {

    max-width: 850px;

    margin:
        8px auto 0;

    color:
        #9aa3b8;

    font-size: 13px;
}

/* SETTINGS */

#settingsScreen {

    display: none;

    height:
        calc(100vh - 65px);

    overflow-y: auto;

    padding:
        25px 15px;
}

.settings-box {

    max-width: 700px;

    margin: auto;
}

.settings-title {

    font-size: 28px;

    font-weight: bold;

    margin-bottom: 22px;
}

.setting {

    padding: 18px;

    margin-bottom: 14px;

    background:
        rgba(20,25,43,.8);

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 16px;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;
}

.setting-name {

    font-weight: bold;

    margin-bottom: 5px;
}

.setting-description {

    color:
        #949db0;

    font-size: 13px;
}

/* SWITCH */

.switch {

    position: relative;

    width: 52px;

    height: 30px;

    flex-shrink: 0;
}

.switch input {

    display: none;
}

.slider {

    position: absolute;

    inset: 0;

    background:
        #343b50;

    border-radius: 30px;

    cursor: pointer;
}

.slider::before {

    content: "";

    position: absolute;

    width: 22px;

    height: 22px;

    left: 4px;

    top: 4px;

    background: white;

    border-radius: 50%;

    transition: .2s;
}

.switch input:checked + .slider {

    background:
        #5969ff;
}

.switch input:checked + .slider::before {

    transform:
        translateX(22px);
}

/* MOBILE */

@media (max-width: 600px) {

    .message {

        max-width: 96%;
    }

    .input-box button {

        padding:
            10px 12px;
    }
}

</style>

</head>

<body>

<header>

    <div class="logo">
        DMN 🤖
    </div>

    <button
        id="settingsButton"
        title="Ayarlar"
    >
        ⚙️
    </button>

</header>

<!-- CHAT -->

<div id="chatScreen">

    <div
        class="messages"
        id="messages"
    >

        <div class="message dmn">

            Merhaba! Ben DMN. 🤖

            Sana nasıl yardımcı olabilirim?

        </div>

    </div>

    <div class="input-area">

        <div class="input-box">

            <button
                id="micButton"
                title="Sesli komut"
            >
                🎤
            </button>

            <input
                id="messageInput"
                type="text"
                placeholder="DMN'ye bir şey sor..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                title="Gönder"
            >
                ➤
            </button>

        </div>

        <div
            class="status"
            id="status"
        >
            💬 DMN hazır
        </div>

    </div>

</div>

<!-- SETTINGS -->

<div id="settingsScreen">

    <div class="settings-box">

        <div class="settings-title">
            ⚙️ DMN Ayarları
        </div>

        <div class="setting">

            <div>

                <div class="setting-name">
                    🔊 Sesli cevap
                </div>

                <div class="setting-description">
                    DMN cevaplarını sesli okur.
                </div>

            </div>

            <label class="switch">

                <input
                    type="checkbox"
                    id="voiceToggle"
                >

                <span class="slider"></span>

            </label>

        </div>

        <div class="setting">

            <div>

                <div class="setting-name">
                    🇬🇧 İngilizce
                </div>

                <div class="setting-description">
                    DMN İngilizce cevap verir.
                </div>

            </div>

            <label class="switch">

                <input
                    type="checkbox"
                    id="englishToggle"
                >

                <span class="slider"></span>

            </label>

        </div>

        <div class="setting">

            <div>

                <div class="setting-name">
                    🆓 Ücretsiz kullanım
                </div>

                <div class="setting-description">
                    Abonelik, reklam ve mesaj limiti yok.
                </div>

            </div>

            <div>
                ✅
            </div>

        </div>

    </div>

</div>

<script>

/* =====================================
   ELEMENTLER
===================================== */

const input =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const micButton =
    document.getElementById(
        "micButton"
    );

const messages =
    document.getElementById(
        "messages"
    );

const statusText =
    document.getElementById(
        "status"
    );

const chatScreen =
    document.getElementById(
        "chatScreen"
    );

const settingsScreen =
    document.getElementById(
        "settingsScreen"
    );

const settingsButton =
    document.getElementById(
        "settingsButton"
    );

const voiceToggle =
    document.getElementById(
        "voiceToggle"
    );

const englishToggle =
    document.getElementById(
        "englishToggle"
    );

/* =====================================
   AYARLAR
===================================== */

let voiceEnabled =
    localStorage.getItem(
        "dmn_voice"
    ) === "true";

let englishEnabled =
    localStorage.getItem(
        "dmn_english"
    ) === "true";

voiceToggle.checked =
    voiceEnabled;

englishToggle.checked =
    englishEnabled;

/* =====================================
   AYARLAR
===================================== */

voiceToggle.addEventListener(
    "change",
    function () {

        voiceEnabled =
            voiceToggle.checked;

        localStorage.setItem(
            "dmn_voice",
            voiceEnabled
        );
    }
);

englishToggle.addEventListener(
    "change",
    function () {

        englishEnabled =
            englishToggle.checked;

        localStorage.setItem(
            "dmn_english",
            englishEnabled
        );
    }
);

/* =====================================
   AYARLAR EKRANI
===================================== */

settingsButton.addEventListener(
    "click",
    function () {

        const open =
            settingsScreen.style.display ===
            "block";

        if (open) {

            settingsScreen.style.display =
                "none";

            chatScreen.style.display =
                "flex";

        } else {

            settingsScreen.style.display =
                "block";

            chatScreen.style.display =
                "none";
        }

    }
);

/* =====================================
   MESAJ EKLE
===================================== */

function mesajEkle(
    text,
    type
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message " + type;

    div.textContent =
        text;

    messages.appendChild(
        div
    );

    messages.scrollTop =
        messages.scrollHeight;
}

/* =====================================
   KODLARI GÖSTER
===================================== */

function cevapEkle(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message dmn";

    const regex =
        /```([\s\S]*?)```/g;

    let lastIndex = 0;

    let match;

    while (
        (match = regex.exec(text)) !== null
    ) {

        const before =
            text.substring(
                lastIndex,
                match.index
            );

        if (before.trim()) {

            const textNode =
                document.createElement(
                    "div"
                );

            textNode.textContent =
                before;

            div.appendChild(
                textNode
            );
        }

        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "code-wrapper";

        const copyButton =
            document.createElement(
                "button"
            );

        copyButton.className =
            "copy-button";

        copyButton.textContent =
            "📋 Kopyala";

        const codeBlock =
            document.createElement(
                "div"
            );

        codeBlock.className =
            "code-block";

        let code =
            match[1];

        code =
            code.replace(
                /^[a-zA-Z0-9_-]+\n/,
                ""
            );

        codeBlock.textContent =
            code.trim();

        copyButton.addEventListener(
            "click",
            async function () {

                try {

                    await navigator
                        .clipboard
                        .writeText(
                            codeBlock.textContent
                        );

                    copyButton.textContent =
                        "✅ Kopyalandı";

                    setTimeout(
                        function () {

                            copyButton.textContent =
                                "📋 Kopyala";

                        },
                        1500
                    );

                } catch {

                    copyButton.textContent =
                        "❌ Kopyalanamadı";
                }

            }
        );

        wrapper.appendChild(
            copyButton
        );

        wrapper.appendChild(
            codeBlock
        );

        div.appendChild(
            wrapper
        );

        lastIndex =
            regex.lastIndex;
    }

    const after =
        text.substring(
            lastIndex
        );

    if (after.trim()) {

        const textNode =
            document.createElement(
                "div"
            );

        textNode.textContent =
            after;

        div.appendChild(
            textNode
        );
    }

    messages.appendChild(
        div
    );

    messages.scrollTop =
        messages.scrollHeight;
}

/* =====================================
   MESAJ GÖNDER
===================================== */

async function mesajGonder() {

    const mesaj =
        input.value.trim();

    if (!mesaj) {
        return;
    }

    mesajEkle(
        "Sen: " + mesaj,
        "user"
    );

    input.value = "";

    sendButton.disabled =
        true;

    input.disabled =
        true;

    statusText.textContent =
        englishEnabled
            ? "🤖 DMN is thinking..."
            : "🤖 DMN düşünüyor...";

    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            mesaj,

                        english:
                            englishEnabled

                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "DMN cevap veremedi."
            );
        }

        cevapEkle(
            data.reply
        );

        statusText.textContent =
            englishEnabled
                ? "💬 DMN ready"
                : "💬 DMN hazır";

        if (voiceEnabled) {

            sesliOku(
                data.reply
            );
        }

    } catch (error) {

        mesajEkle(
            "DMN: " +
            error.message,
            "dmn"
        );

        statusText.textContent =
            englishEnabled
                ? "❌ Error"
                : "❌ Hata";

        console.error(
            "DMN HATASI:",
            error
        );

    } finally {

        sendButton.disabled =
            false;

        input.disabled =
            false;

        input.focus();
    }
}

/* =====================================
   ENTER
===================================== */

input.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            mesajGonder();
        }

    }
);

/* =====================================
   GÖNDER BUTONU
===================================== */

sendButton.addEventListener(
    "click",
    mesajGonder
);

/* =====================================
   SES
===================================== */

function sesliOku(
    text
) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    speechSynthesis.cancel();

    const temiz =
        text
            .replace(
                /```[\s\S]*?```/g,
                " "
            )
            .replace(
                /`[^`]*`/g,
                " "
            )
            .trim();

    if (!temiz) {
        return;
    }

    const utterance =
        new SpeechSynthesisUtterance(
            temiz
        );

    utterance.lang =
        englishEnabled
            ? "en-US"
            : "tr-TR";

    utterance.rate =
        0.95;

    utterance.pitch =
        1;

    utterance.volume =
        1;

    speechSynthesis.speak(
        utterance
    );
}

/* =====================================
   MİKROFON
===================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.onstart =
        function () {

            micButton.textContent =
                "🔴";

            statusText.textContent =
                englishEnabled
                    ? "🎤 Listening..."
                    : "🎤 Dinliyorum...";
        };

    recognition.onend =
        function () {

            micButton.textContent =
                "🎤";
        };

    recognition.onerror =
        function () {

            micButton.textContent =
                "🎤";
        };

    recognition.onresult =
        function (event) {

            const text =
                event
                    .results[0][0]
                    .transcript;

            input.value =
                text;

            mesajGonder();
        };

} else {

    micButton.disabled =
        true;
}

/* =====================================
   MİKROFON BUTONU
===================================== */

micButton.addEventListener(
    "click",
    function () {

        if (!recognition) {
            return;
        }

        recognition.lang =
            englishEnabled
                ? "en-US"
                : "tr-TR";

        try {

            recognition.start();

        } catch (error) {

            console.log(error);

        }
    }
);

/* =====================================
   BAŞLANGIÇ
===================================== */

input.focus();

</script>

</body>

</html>
````
