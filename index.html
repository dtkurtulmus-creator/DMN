    <meta name="google-site-verification" content="mBO_SXlln8r7ot4GJeNZK81rDS11GLJPQZbGsy6jHCQ">
    <meta charset="UTF-8">

    <style>

            box-sizing: border-box;

        }

        button:disabled {

            margin: 8px auto 0;

        #settingsScreen {
            display: none;

        .setting-description {

        }

        .switch {
            position: relative;
            width: 52px;
            height: 30px;
            flex-shrink: 0;

            display: none;

        .slider {
            position: absolute;
            inset: 0;

            transition: 0.2s;
        }

        }

        .switch input:checked + .slider:before {
            transform: translateX(22px);

        .back-settings {

<body>

<header>
    <span>DMN 🤖</span>

    <button id="settingsButton" title="Ayarlar">
        ⚙️
    </button>
</header>


<div id="chatScreen" class="screen">

    <div class="messages" id="messages"></div>


    <div class="preview" id="preview">

        <img
            id="previewImage"
            alt="Seçilen fotoğraf"
        >

        <button
            class="remove-image"
            id="removeImageButton"
        >
            ✕
        </button>

    </div>


    <div class="input-area">

        <div class="input-box">

            <button
                id="imageButton"
                title="Fotoğraf ekle"
            >
                📷
            </button>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <button
                id="micButton"
                title="Sesli komut"
            >
                🎤
            </button>

            <input
                id="messageInput"
                type="text"
                placeholder="DMN'ye bir şey sor..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                title="Gönder"
            >
                ➤
            </button>

        </div>

        <div class="status" id="status">
            🔊 Sesli cevap: Kapalı
        </div>

    </div>

</div>


<div id="settingsScreen" class="screen">

    <div class="settings-box">

        <button
            class="back-settings"
            id="settingsBackButton"
        >
            ← Sohbete dön
        </button>

        <div class="settings-title">
            ⚙️ DMN Ayarları
        </div>


        <div class="setting">

            <div class="setting-info">

                <div class="setting-name">
                    🔊 Sesli cevap
                </div>

                <div class="setting-description">
                    DMN cevaplarını sesli olarak okur.
                </div>

            </div>

            <label class="switch">

                <input
                    type="checkbox"
                    id="voiceToggle"
                >

                <span class="slider"></span>

            </label>

        </div>


        <div class="setting">

            <div class="setting-info">

                <div class="setting-name">
                    🇬🇧 İngilizce konuşma
                </div>

                <div class="setting-description">
                    DMN İngilizce cevap verir.
                </div>

            </div>

            <label class="switch">

                <input
                    type="checkbox"
                    id="englishToggle"
                >

                <span class="slider"></span>

            </label>

        </div>


        <div class="setting">

            <div class="setting-info">

                <div class="setting-name">
                    💬 Sohbet modu
                </div>

                <div class="setting-description">
                    DMN doğal ve sohbet tarzında cevap verir.
                </div>

            </div>

            <label class="switch">

                <input
                    type="checkbox"
                    id="chatToggle"
                    checked
                    disabled
                >

                <span class="slider"></span>

            </label>

        </div>


        <div class="setting">

            <div class="setting-info">

                <div class="setting-name">
                    💾 Sohbet geçmişi
                </div>

                <div class="setting-description">
                    Konuşmalar tarayıcıda otomatik olarak kaydedilir.
                </div>

            </div>

        </div>


        <div class="history-buttons">

            <button
                id="clearHistoryButton"
                class="danger-button"
            >
                🗑️ Sohbet geçmişini sil
            </button>

        </div>

    </div>

</div>


<script>

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const imageButton =
    document.getElementById("imageButton");

const imageInput =
    document.getElementById("imageInput");

const removeImageButton =
    document.getElementById("removeImageButton");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const messages =
    document.getElementById("messages");

const statusText =
    document.getElementById("status");

const chatScreen =
    document.getElementById("chatScreen");

const settingsScreen =
    document.getElementById("settingsScreen");

const settingsButton =
    document.getElementById("settingsButton");

const settingsBackButton =
    document.getElementById("settingsBackButton");

const voiceToggle =
    document.getElementById("voiceToggle");

const englishToggle =
    document.getElementById("englishToggle");

const clearHistoryButton =
    document.getElementById("clearHistoryButton");


let voiceEnabled =
    localStorage.getItem("dmn_voice") === "true";

let englishEnabled =
    localStorage.getItem("dmn_english") === "true";

let selectedImage = null;


voiceToggle.checked =
    voiceEnabled;

englishToggle.checked =
    englishEnabled;


// =====================================
// SOHBET GEÇMİŞİ
// =====================================

let sohbetGecmisi = [];

try {

    const kayitliSohbet =
        localStorage.getItem("dmn_chat_history");

    if (kayitliSohbet) {

        sohbetGecmisi =
            JSON.parse(kayitliSohbet);

    }

} catch (error) {

    console.error(
        "Sohbet geçmişi okunamadı:",
        error
    );

    sohbetGecmisi = [];

}


// =====================================
// SOHBETİ KAYDET
// =====================================

function sohbetiKaydet() {

    try {

        localStorage.setItem(
            "dmn_chat_history",
            JSON.stringify(sohbetGecmisi)
        );

    } catch (error) {

        console.error(
            "Sohbet kaydedilemedi:",
            error
        );

    }

}


// =====================================
// KAYITLI SOHBETİ YÜKLE
// =====================================

function sohbetiYukle() {

    messages.innerHTML = "";

    if (
        !sohbetGecmisi ||
        sohbetGecmisi.length === 0
    ) {

        mesajEkle(
            "Merhaba! Ben DMN. 🤖\nBana istediğin şeyi sorabilirsin.",
            "dmn",
            false
        );

        return;
    }


    sohbetGecmisi.forEach(
        function(kayit) {

            if (
                kayit.type === "image" &&
                kayit.image
            ) {

                resimEkle(
                    kayit.image,
                    false
                );

            } else {

                mesajEkle(
                    kayit.text,
                    kayit.role,
                    false
                );

            }

        }
    );

}


// =====================================
// AYARLAR
// =====================================

function ayarlariGuncelle() {

    voiceEnabled =
        voiceToggle.checked;

    englishEnabled =
        englishToggle.checked;


    localStorage.setItem(
        "dmn_voice",
        String(voiceEnabled)
    );

    localStorage.setItem(
        "dmn_english",
        String(englishEnabled)
    );


    if (voiceEnabled) {

        statusText.textContent =
            englishEnabled
                ? "Voice: English"
                : "Sesli cevap: Açık";

    } else {

        statusText.textContent =
            englishEnabled
                ? "Voice: Off | English"
                : "Sesli cevap: Kapalı";

    }

}


voiceToggle.addEventListener(
    "change",
    ayarlariGuncelle
);


englishToggle.addEventListener(
    "change",
    ayarlariGuncelle
);


// =====================================
// AYARLAR EKRANI
// =====================================

settingsButton.addEventListener(
    "click",
    function() {

        chatScreen.style.display =
            "none";

        settingsScreen.style.display =
            "block";

    }
);


settingsBackButton.addEventListener(
    "click",
    function() {

        settingsScreen.style.display =
            "none";

        chatScreen.style.display =
            "flex";

    }
);


clearHistoryButton.addEventListener(
    "click",
    function() {

        const onay =
            confirm(
                "Tüm sohbet geçmişi silinsin mi?"
            );

        if (!onay) {
            return;
        }


        sohbetGecmisi = [];

        localStorage.removeItem(
            "dmn_chat_history"
        );

        sohbetiYukle();

    }
);


// =====================================
// MESAJ EKLE
// =====================================

function mesajEkle(
    text,
    type,
    kaydet = true
) {

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent =
        text;

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;


    if (kaydet) {

        sohbetGecmisi.push({

            role:
                type === "user"
                    ? "user"
                    : "dmn",

            type:
                "text",

            text:
                text

        });

        sohbetiKaydet();

    }

}


// =====================================
// RESİM EKLE
// =====================================

function resimEkle(
    src,
    kaydet = true
) {

    const div =
        document.createElement("div");

    div.className =
        "message user";


    const img =
        document.createElement("img");

    img.src =
        src;

    img.className =
        "message-image";

    img.alt =
        "Gönderilen fotoğraf";


    div.appendChild(img);

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;


    if (kaydet) {

        sohbetGecmisi.push({

            role:
                "user",

            type:
                "image",

            image:
                src

        });

        sohbetiKaydet();

    }

}


// =====================================
// KOD İSTEĞİ
// =====================================

function kodIstegiMi(mesaj) {

    const text =
        mesaj.toLowerCase();


    const kelimeler = [

        "kod ver",
        "kodu ver",
        "kod yaz",
        "kodu yaz",
        "kod oluştur",
        "kod olustur",
        "kod yap",
        "kodunu ver",
        "program yaz",
        "program oluştur",
        "program olustur"

    ];


    return kelimeler.some(
        kelime =>
            text.includes(kelime)
    );

}


// =====================================
// RESİM İSTEĞİ
// =====================================

function resimIstegiMi(mesaj) {

    const text =
        mesaj.toLowerCase();


    const kelimeler = [

        "resim oluştur",
        "resim olustur",
        "resim yap",
        "fotoğraf oluştur",
        "fotoğraf olustur",
        "görsel oluştur",
        "gorsel olustur",
        "bir resim çiz",
        "resim çiz"

    ];


    return kelimeler.some(
        kelime =>
            text.includes(kelime)
    );

}


// =====================================
// FOTOĞRAF SEÇ
// =====================================

imageButton.addEventListener(
    "click",
    function() {

        imageInput.click();

    }
);


imageInput.addEventListener(
    "change",
    function() {

        const file =
            imageInput.files[0];


        if (!file) {
            return;
        }


        if (
            !file.type.startsWith("image/")
        ) {

            alert(
                "Lütfen bir fotoğraf seç."
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                selectedImage =
                    event.target.result;

                previewImage.src =
                    selectedImage;

                preview.style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);


// =====================================
// FOTOĞRAFI KALDIR
// =====================================

removeImageButton.addEventListener(
    "click",
    function() {

        selectedImage = null;

        imageInput.value = "";

        preview.style.display =
            "none";

        previewImage.src = "";

    }
);


// =====================================
// MESAJ GÖNDER
// =====================================

async function mesajGonder() {

    const mesaj =
        input.value.trim();


    if (
        !mesaj &&
        !selectedImage
    ) {

        return;

    }


    if (mesaj) {

        mesajEkle(
            "Sen: " + mesaj,
            "user"
        );

    }


    if (selectedImage) {

        resimEkle(
            selectedImage
        );

    }


    const gonderilecekResim =
        selectedImage;


    input.value = "";

    selectedImage = null;

    imageInput.value = "";

    preview.style.display =
        "none";

    previewImage.src = "";


    const loading =
        document.createElement("div");

    loading.className =
        "message dmn";

    loading.textContent =
        englishEnabled
            ? "DMN is thinking..."
            : "DMN düşünüyor...";


    messages.appendChild(
        loading
    );

    messages.scrollTop =
        messages.scrollHeight;


    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            mesaj,

                        english:
                            englishEnabled,

                        codeMode:
                            kodIstegiMi(mesaj),

                        image:
                            gonderilecekResim

                    })

                }
            );


        const data =
            await response.json();


        loading.remove();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "DMN cevap veremedi."
            );

        }


        mesajEkle(
            "DMN: " + data.reply,
            "dmn"
        );


        if (voiceEnabled) {

            sesliOku(
                data.reply
            );

        }

    } catch (error) {

        loading.remove();


        mesajEkle(
            "DMN: " +
            error.message,
            "dmn"
        );


        console.error(
            "DMN hatası:",
            error
        );

    }

}


// =====================================
// SES METNİNİ TEMİZLE
// =====================================

function seslendirilecekMetniTemizle(
    metin
) {

    let temiz =
        String(metin || "");


    // Kod bloklarını kaldır
    temiz =
        temiz.replace(
            /```[\s\S]*?```/g,
            " "
        );


    // Satır içi kodları kaldır
    temiz =
        temiz.replace(
            /`[^`]*`/g,
            " "
        );


    // URL'leri kaldır
    temiz =
        temiz.replace(
            /https?:\/\/\S+/gi,
            " "
        );


    // Emoji karakterlerini kaldır
    temiz =
        temiz.replace(
            /[\u{1F300}-\u{1FAFF}]/gu,
            " "
        );


    // Bayrak emojilerini kaldır
    temiz =
        temiz.replace(
            /[\u{1F1E6}-\u{1F1FF}]/gu,
            " "
        );


    // Diğer sembol emojilerini kaldır
    temiz =
        temiz.replace(
            /[\u2600-\u27BF]/g,
            " "
        );


    // Markdown karakterlerini kaldır
    temiz =
        temiz.replace(
            /[#*_~]/g,
            " "
        );


    // Fazla boşlukları temizle
    temiz =
        temiz.replace(
            /\s+/g,
            " "
        );


    return temiz.trim();

}


// =====================================
// SESLİ CEVAP
// =====================================

function sesliOku(metin) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    const temizMetin =
        seslendirilecekMetniTemizle(
            metin
        );


    if (!temizMetin) {

        return;

    }


    window.speechSynthesis.cancel();


    const sesler =
        window.speechSynthesis
            .getVoices();


    let secilenSes;


    if (englishEnabled) {

        secilenSes =
            sesler.find(
                ses =>
                    /^en[-_]/i.test(
                        ses.lang
                    )
            );

    } else {

        secilenSes =
            sesler.find(
                ses =>
                    ses.name.includes(
                        "Microsoft Tolga"
                    )
            )
            ||
            sesler.find(
                ses =>
                    /^tr[-_]/i.test(
                        ses.lang
                    )
            );

    }


    if (!secilenSes) {

        console.warn(
            "Uygun ses bulunamadı."
        );

        return;

    }


    const konusma =
        new SpeechSynthesisUtterance(
            temizMetin
        );


    konusma.voice =
        secilenSes;


    konusma.lang =
        englishEnabled
            ? "en-US"
            : "tr-TR";


    konusma.rate =
        0.95;


    konusma.pitch =
        0.9;


    konusma.volume =
        1;


    konusma.onstart =
        function() {

            statusText.textContent =
                englishEnabled
                    ? "Speaking English..."
                    : "Konuşuyor...";

        };


    konusma.onend =
        function() {

            ayarlariGuncelle();

        };


    konusma.onerror =
        function(event) {

            console.error(
                "Ses hatası:",
                event
            );

            ayarlariGuncelle();

        };


    window.speechSynthesis.speak(
        konusma
    );

}


// =====================================
// SESLİ KOMUT
// =====================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            micButton.classList.add(
                "recording"
            );

            micButton.textContent =
                "🔴";


            statusText.textContent =
                englishEnabled
                    ? "Listening..."
                    : "Dinliyorum...";

        };


    recognition.onend =
        function() {

            micButton.classList.remove(
                "recording"
            );

            micButton.textContent =
                "🎤";


            ayarlariGuncelle();

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Mikrofon hatası:",
                event.error
            );


            micButton.classList.remove(
                "recording"
            );


            micButton.textContent =
                "🎤";


            statusText.textContent =
                englishEnabled
                    ? "Microphone error"
                    : "Mikrofon hatası";

        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript;


            input.value =
                text;


            mesajGonder();

        };

} else {

    micButton.disabled =
        true;


    statusText.textContent =
        englishEnabled
            ? "Voice input is not supported."
            : "Sesli komut desteklenmiyor.";

}


// =====================================
// MİKROFON BUTONU
// =====================================

micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {

            return;

        }


        recognition.lang =
            englishEnabled
                ? "en-US"
                : "tr-TR";


        try {

            recognition.start();

        } catch (error) {

            console.log(error);

        }

    }
);


// =====================================
// GÖNDER BUTONU
// =====================================

sendButton.addEventListener(
    "click",
    mesajGonder
);


// =====================================
// ENTER
// =====================================

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            mesajGonder();

        }

    }
);


// =====================================
// SESLER HAZIR OLDUĞUNDA
// =====================================

window.speechSynthesis.onvoiceschanged =
    function() {

        window.speechSynthesis
            .getVoices();

    };


// =====================================
// BAŞLANGIÇ
// =====================================

ayarlariGuncelle();

sohbetiYukle();

</script>
