```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DMN AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0d10;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    height: 65px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid #252830;
    background: #101318;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.status {
    margin-left: 12px;
    font-size: 13px;
    color: #65e6a4;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.message {
    max-width: 850px;
    margin: 0 auto 20px auto;
    padding: 15px 18px;
    border-radius: 16px;
    line-height: 1.55;
    white-space: pre-wrap;
}

.user {
    background: #1d2735;
}

.dmn {
    background: #15191f;
}

.message-name {
    font-size: 12px;
    opacity: .6;
    margin-bottom: 6px;
}

.bottom {
    padding: 15px;
    border-top: 1px solid #252830;
    background: #101318;
}

.input-area {
    max-width: 900px;
    margin: auto;
    display: flex;
    gap: 8px;
}

textarea {
    flex: 1;
    resize: none;
    min-height: 52px;
    max-height: 150px;
    padding: 15px;
    border: 1px solid #30343c;
    border-radius: 15px;
    background: #171a20;
    color: white;
    outline: none;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 14px;
    min-width: 52px;
    cursor: pointer;
    background: #252b35;
    color: white;
    font-size: 20px;
}

button:hover {
    background: #343b48;
}

.send {
    background: #ffffff;
    color: #000;
}

.send:hover {
    background: #dddddd;
}

/* =========================
   SES KÜRESİ
========================= */

.voice-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(5, 7, 10, .88);
    z-index: 100;
}

.voice-overlay.active {
    display: flex;
}

.voice-container {
    text-align: center;
}

.voice-orb {
    width: 150px;
    height: 150px;
    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #aeb8ff 15%,
            #6574ff 35%,
            #353cff 60%,
            #1517a8 100%
        );

    box-shadow:
        0 0 30px rgba(92, 105, 255, .8),
        0 0 80px rgba(92, 105, 255, .5);

    animation: orbIdle 2s ease-in-out infinite;
    transition: transform .12s ease;
}

.voice-orb.speaking {
    animation: orbSpeaking .55s ease-in-out infinite alternate;
}

@keyframes orbIdle {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

@keyframes orbSpeaking {
    0% {
        transform: scale(.92);
    }

    100% {
        transform: scale(1.22);
    }
}

.voice-text {
    margin-top: 25px;
    font-size: 17px;
    opacity: .85;
}

.close-voice {
    margin-top: 20px;
    padding: 12px 22px;
    border-radius: 12px;
    background: #252b35;
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">DMN</div>
    <div class="status">● ONLINE</div>
</header>

<div id="chat" class="chat"></div>

<div class="bottom">

    <div class="input-area">

        <textarea
            id="message"
            placeholder="DMN'ye bir şey sor..."
        ></textarea>

        <button
            id="micButton"
            title="Sesli konuş"
        >
            🎤
        </button>

        <button
            id="sendButton"
            class="send"
            title="Gönder"
        >
            ➤
        </button>

    </div>

</div>

</div>


<!-- SES EKRANI -->

<div
    id="voiceOverlay"
    class="voice-overlay"
>

    <div class="voice-container">

        <div
            id="voiceOrb"
            class="voice-orb"
        ></div>

        <div
            id="voiceText"
            class="voice-text"
        >
            DMN dinliyor...
        </div>

        <button
            id="closeVoice"
            class="close-voice"
        >
            Kapat
        </button>

    </div>

</div>


<script>

const chat =
    document.getElementById("chat");

const messageInput =
    document.getElementById("message");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const voiceOverlay =
    document.getElementById("voiceOverlay");

const voiceOrb =
    document.getElementById("voiceOrb");

const voiceText =
    document.getElementById("voiceText");

const closeVoice =
    document.getElementById("closeVoice");


/* =========================
   MESAJ EKLE
========================= */

function addMessage(text, type) {

    const box =
        document.createElement("div");

    box.className =
        "message " + type;

    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        type === "user"
            ? "Sen"
            : "DMN";

    const content =
        document.createElement("div");

    content.textContent = text;

    box.appendChild(name);
    box.appendChild(content);

    chat.appendChild(box);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   CHAT
========================= */

async function sendMessage() {

    const message =
        messageInput.value.trim();

    if (!message) return;

    addMessage(message, "user");

    messageInput.value = "";

    sendButton.disabled = true;

    try {

        const response =
            await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: message
                })

            });

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "DMN cevap veremedi."
            );
        }

        const reply =
            data.reply || "";

        addMessage(reply, "dmn");

    } catch (error) {

        addMessage(
            "Hata: " + error.message,
            "dmn"
        );

    } finally {

        sendButton.disabled = false;
        messageInput.focus();

    }
}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   SESLİ KONUŞMA
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang = "tr-TR";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = function() {

        voiceOverlay.classList.add(
            "active"
        );

        voiceOrb.classList.remove(
            "speaking"
        );

        voiceText.textContent =
            "DMN dinliyor...";

    };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0].transcript;

            messageInput.value = text;

            voiceText.textContent =
                "DMN düşünüyor...";

            sendVoiceMessage(text);

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Mikrofon hatası:",
                event.error
            );

            voiceText.textContent =
                "Mikrofon kullanılamadı.";

            setTimeout(
                closeVoiceMode,
                1500
            );

        };


    recognition.onend =
        function() {

            if (
                voiceText.textContent ===
                "DMN dinliyor..."
            ) {

                closeVoiceMode();

            }

        };

} else {

    micButton.disabled = true;

    micButton.title =
        "Tarayıcınız ses tanımayı desteklemiyor.";

}


/* =========================
   MİKROFON
========================= */

micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {

            alert(
                "Tarayıcınız sesli konuşmayı desteklemiyor."
            );

            return;

        }

        try {

            recognition.start();

        } catch (error) {

            console.error(error);

        }

    }
);


/* =========================
   SESLİ DMN CEVABI
========================= */

async function sendVoiceMessage(text) {

    try {

        const response =
            await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: text
                })

            });

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "DMN cevap veremedi."
            );

        }

        const reply =
            data.reply || "";

        addMessage(text, "user");
        addMessage(reply, "dmn");

        speakDMN(reply);

    } catch (error) {

        voiceText.textContent =
            "Hata oluştu.";

        addMessage(
            "Hata: " + error.message,
            "dmn"
        );

        setTimeout(
            closeVoiceMode,
            1500
        );

    }

}


/* =========================
   DMN SESİ
========================= */

function speakDMN(text) {

    if (!("speechSynthesis" in window)) {

        voiceText.textContent =
            "Tarayıcınız sesli cevabı desteklemiyor.";

        setTimeout(
            closeVoiceMode,
            2000
        );

        return;

    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "tr-TR";

    utterance.rate = 1;

    utterance.pitch = 1;

    utterance.volume = 1;


    utterance.onstart =
        function() {

            voiceOverlay.classList.add(
                "active"
            );

            voiceOrb.classList.add(
                "speaking"
            );

            voiceText.textContent =
                "DMN konuşuyor...";

        };


    utterance.onend =
        function() {

            voiceOrb.classList.remove(
                "speaking"
            );

            voiceText.textContent =
                "Konuşma tamamlandı.";

            setTimeout(
                closeVoiceMode,
                700
            );

        };


    utterance.onerror =
        function() {

            voiceOrb.classList.remove(
                "speaking"
            );

            voiceText.textContent =
                "Ses oynatılamadı.";

            setTimeout(
                closeVoiceMode,
                1500
            );

        };


    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================
   SES EKRANINI KAPAT
========================= */

function closeVoiceMode() {

    voiceOverlay.classList.remove(
        "active"
    );

    voiceOrb.classList.remove(
        "speaking"
    );

    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }

}


closeVoice.addEventListener(
    "click",
    closeVoiceMode
);


/* =========================
   BAŞLANGIÇ
========================= */

addMessage(
    "Merhaba! Ben DMN. Sana nasıl yardımcı olabilirim?",
    "dmn"
);

</script>

</body>
</html>
