<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>DMN</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel2: #181c26;
    --border: #292f3c;
    --text: #f5f7fb;
    --muted: #9299aa;
    --accent: #7c5cff;
}

body {
    margin: 0;
    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(124,92,255,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(0,180,255,.10),
            transparent 25%
        ),
        #0b0d12;

    color: var(--text);
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

button {
    border: 0;
    color: white;
    background: transparent;
    cursor: pointer;
}

button:hover {
    background: rgba(255,255,255,.08);
}

.app {
    display: flex;
    height: 100vh;
}


/* =====================================
   SIDEBAR
===================================== */

.sidebar {
    width: 270px;
    background:
        linear-gradient(
            180deg,
            #11141c,
            #0d1016
        );

    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 14px;
}

.new-chat {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    background: #252a36;
    text-align: left;
    font-size: 15px;
    margin-bottom: 15px;
}

.history-title {
    color: var(--muted);
    font-size: 12px;
    padding: 8px;
}

.history {
    flex: 1;
    overflow-y: auto;
}

.history-item {
    width: 100%;
    text-align: left;
    padding: 11px;
    border-radius: 10px;
    margin-bottom: 5px;
    color: #dce0e9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.history-item.active {
    background: #242936;
}

.sidebar-bottom {
    border-top: 1px solid var(--border);
    padding-top: 10px;
}

.settings-button {
    width: 100%;
    padding: 12px;
    text-align: left;
    border-radius: 10px;
}


/* =====================================
   MAIN
===================================== */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

header {
    height: 64px;
    flex-shrink: 0;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(13,16,22,.85);
    backdrop-filter: blur(15px);
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.online {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4caf50;
}

.header-spacer {
    flex: 1;
}

.mobile-menu {
    display: none;
    font-size: 22px;
}


/* =====================================
   CHAT
===================================== */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px 18px 160px;
}

.message {
    max-width: 850px;
    margin: 16px auto;
    padding: 15px 18px;
    border-radius: 17px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #252a36;
}

.dmn {
    background:
        linear-gradient(
            135deg,
            rgba(124,92,255,.08),
            rgba(255,255,255,.025)
        );

    border: 1px solid var(--border);
}

.message-image {
    display: block;
    max-width: 100%;
    max-height: 500px;
    border-radius: 14px;
    margin-top: 10px;
}

.generated-image {
    width: 100%;
    border-radius: 15px;
    margin-top: 10px;
}


/* =====================================
   CODE
===================================== */

.code-wrapper {
    margin-top: 12px;
    border: 1px solid #303646;
    border-radius: 12px;
    overflow: hidden;
    background: #090b0f;
}

.code-header {
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    background: #151922;
    color: #9da5b8;
    font-size: 12px;
}

.copy-button {
    background: #252a36;
    padding: 6px 10px;
    border-radius: 7px;
    font-size: 12px;
}

.code-wrapper pre {
    margin: 0;
    padding: 15px;
    overflow-x: auto;
    white-space: pre;
}

.code-wrapper code {
    font-family: Consolas, monospace;
    font-size: 13px;
}


/* =====================================
   INPUT
===================================== */

.input-area {
    position: fixed;
    bottom: 0;
    left: 270px;
    right: 0;
    padding: 15px 18px 20px;
    background:
        linear-gradient(
            transparent,
            rgba(11,13,18,.96) 25%
        );
}

.input-box {
    max-width: 850px;
    margin: auto;
    min-height: 58px;
    padding: 8px;
    border: 1px solid #343b4a;
    border-radius: 18px;
    background: #171b24;
    display: flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 10px 35px rgba(0,0,0,.3);
}

.input-box input {
    flex: 1;
    min-width: 0;
    background: transparent;
    color: white;
    border: 0;
    outline: 0;
    font-size: 16px;
    padding: 12px;
}

.tool-button {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    font-size: 19px;
}

.send-button {
    background: var(--accent);
    width: 42px;
    height: 42px;
    border-radius: 12px;
    font-size: 19px;
}

.status {
    max-width: 850px;
    margin: 7px auto 0;
    color: var(--muted);
    font-size: 11px;
}


/* =====================================
   PREVIEW
===================================== */

.preview {
    display: none;
    max-width: 850px;
    margin: 0 auto 8px;
    padding: 8px;
    background: #171b24;
    border: 1px solid var(--border);
    border-radius: 12px;
}

.preview img {
    max-width: 150px;
    max-height: 100px;
    border-radius: 9px;
}

.remove-button {
    margin-left: 10px;
    background: #252a36;
    padding: 7px 10px;
    border-radius: 8px;
}


/* =====================================
   SETTINGS
===================================== */

.settings-screen {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 30px;
}

.settings-box {
    max-width: 700px;
    margin: auto;
}

.settings-title {
    font-size: 28px;
    margin-bottom: 25px;
}

.setting {
    background: #191e29;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.setting-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.setting-description {
    color: var(--muted);
    font-size: 13px;
}

.switch {
    position: relative;
    width: 52px;
    height: 30px;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    inset: 0;
    background: #353c4b;
    border-radius: 30px;
}

.slider:before {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    left: 4px;
    top: 4px;
    background: white;
    border-radius: 50%;
    transition: .2s;
}

.switch input:checked + .slider {
    background: #4caf50;
}

.switch input:checked + .slider:before {
    transform: translateX(22px);
}


/* =====================================
   FILE
===================================== */

#imageInput,
#fileInput {
    display: none;
}


/* =====================================
   MOBILE
===================================== */

@media (max-width: 700px) {

    .sidebar {
        position: fixed;
        z-index: 20;
        left: -280px;
        top: 0;
        bottom: 0;
        transition: .2s;
    }

    .sidebar.open {
        left: 0;
    }

    .mobile-menu {
        display: block;
    }

    .input-area {
        left: 0;
    }

    .chat {
        padding-left: 10px;
        padding-right: 10px;
    }

    .message {
        max-width: 95%;
    }

}

</style>

</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <button
            class="new-chat"
            id="newChatButton">
            ＋ Yeni sohbet
        </button>

        <div class="history-title">
            Sohbetler
        </div>

        <div
            class="history"
            id="history">
        </div>

        <div class="sidebar-bottom">

            <button
                class="settings-button"
                id="settingsButton">
                ⚙️ Ayarlar
            </button>

        </div>

    </aside>


    <main class="main">

        <header>

            <button
                class="mobile-menu"
                id="mobileMenu">
                ☰
            </button>

            <div class="logo">
                DMN 🤖
            </div>

            <div class="online"></div>

            <div class="header-spacer"></div>

        </header>


        <div
            class="chat"
            id="messages">

            <div class="message dmn">
                Merhaba! Ben DMN. 🤖
                Bana istediğin şeyi sorabilirsin.
            </div>

        </div>


        <div
            class="settings-screen"
            id="settingsScreen">

            <div class="settings-box">

                <div class="settings-title">
                    ⚙️ Ayarlar
                </div>

                <div class="setting">

                    <div>

                        <div class="setting-name">
                            🔊 Sesli cevap
                        </div>

                        <div class="setting-description">
                            DMN cevaplarını sesli okur.
                        </div>

                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="voiceToggle">

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="setting">

                    <div>

                        <div class="setting-name">
                            🇬🇧 İngilizce
                        </div>

                        <div class="setting-description">
                            DMN İngilizce cevap verir.
                        </div>

                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="englishToggle">

                        <span class="slider"></span>

                    </label>

                </div>

            </div>

        </div>


        <div
            class="input-area"
            id="inputArea">

            <div
                class="preview"
                id="preview">

                <img
                    id="previewImage"
                    alt="Fotoğraf">

                <button
                    class="remove-button"
                    id="removeImage">
                    ✕
                </button>

            </div>


            <div class="input-box">

                <button
                    class="tool-button"
                    id="fileButton"
                    title="Dosya ekle">
                    📎
                </button>

                <input
                    type="file"
                    id="fileInput">

                <button
                    class="tool-button"
                    id="imageButton"
                    title="Fotoğraf ekle">
                    📷
                </button>

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*">

                <button
                    class="tool-button"
                    id="micButton"
                    title="Konuş">
                    🎤
                </button>

                <input
                    id="messageInput"
                    type="text"
                    placeholder="DMN'ye bir şey sor..."
                    autocomplete="off">

                <button
                    class="send-button"
                    id="sendButton">
                    ➤
                </button>

            </div>

            <div
                class="status"
                id="status">
                DMN hazır
            </div>

        </div>

    </main>

</div>


<script>

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const imageButton =
    document.getElementById("imageButton");

const imageInput =
    document.getElementById("imageInput");

const fileButton =
    document.getElementById("fileButton");

const fileInput =
    document.getElementById("fileInput");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const removeImage =
    document.getElementById("removeImage");

const messages =
    document.getElementById("messages");

const history =
    document.getElementById("history");

const statusText =
    document.getElementById("status");

const sidebar =
    document.getElementById("sidebar");

const settingsButton =
    document.getElementById("settingsButton");

const settingsScreen =
    document.getElementById("settingsScreen");

const inputArea =
    document.getElementById("inputArea");

const newChatButton =
    document.getElementById("newChatButton");

const mobileMenu =
    document.getElementById("mobileMenu");

const voiceToggle =
    document.getElementById("voiceToggle");

const englishToggle =
    document.getElementById("englishToggle");


let selectedImage = null;

let selectedFile = null;

let currentChatId = null;

let voiceEnabled =
    localStorage.getItem("dmn_voice") === "true";

let englishEnabled =
    localStorage.getItem("dmn_english") === "true";


voiceToggle.checked =
    voiceEnabled;

englishToggle.checked =
    englishEnabled;


// =====================================
// SOHBET VERİLERİ
// =====================================

function sohbetleriGetir() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "dmn_chats"
            ) || "[]"
        );

    } catch {

        return [];

    }

}


function sohbetleriKaydet(chats) {

    localStorage.setItem(
        "dmn_chats",
        JSON.stringify(chats)
    );

}


function yeniChat() {

    const chat = {

        id:
            Date.now().toString(),

        title:
            "Yeni sohbet",

        messages: []

    };

    const chats =
        sohbetleriGetir();

    chats.unshift(chat);

    sohbetleriKaydet(chats);

    currentChatId =
        chat.id;

    mesajlariTemizle();

    gecmisiGoster();

}


function mesajlariTemizle() {

    messages.innerHTML = "";

}


function mevcutSohbet() {

    const chats =
        sohbetleriGetir();

    return chats.find(
        chat =>
            chat.id === currentChatId
    );

}


function mesajKaydet(role, text, image) {

    const chats =
        sohbetleriGetir();

    const chat =
        chats.find(
            item =>
                item.id === currentChatId
        );

    if (!chat) {
        return;
    }

    chat.messages.push({

        role: role,

        text: text || "",

        image: image || null

    });

    if (
        chat.title === "Yeni sohbet" &&
        text
    ) {

        chat.title =
            text.substring(0, 35);

    }

    sohbetleriKaydet(chats);

    gecmisiGoster();

}


function gecmisiGoster() {

    history.innerHTML = "";

    const chats =
        sohbetleriGetir();

    chats.forEach(chat => {

        const button =
            document.createElement("button");

        button.className =
            "history-item";

        if (
            chat.id === currentChatId
        ) {

            button.classList.add(
                "active"
            );

        }

        button.textContent =
            chat.title;

        button.onclick =
            function() {

                sohbetAc(
                    chat.id
                );

            };

        history.appendChild(
            button
        );

    });

}


function sohbetAc(id) {

    const chats =
        sohbetleriGetir();

    const chat =
        chats.find(
            item =>
                item.id === id
        );

    if (!chat) {
        return;
    }

    currentChatId = id;

    mesajlariTemizle();

    chat.messages.forEach(
        item => {

            if (item.text) {

                mesajEkle(
                    item.text,
                    item.role
                );

            }

            if (item.image) {

                resimGoster(
                    item.image,
                    item.role
                );

            }

        }
    );

    gecmisiGoster();

    settingsScreen.style.display =
        "none";

    inputArea.style.display =
        "block";

    sidebar.classList.remove(
        "open"
    );

}


// =====================================
// İLK SOHBET
// =====================================

function baslat() {

    const chats =
        sohbetleriGetir();

    if (!chats.length) {

        yeniChat();

    } else {

        sohbetAc(
            chats[0].id
        );

    }

}

baslat();


// =====================================
// AYARLAR
// =====================================

function ayarlariGuncelle() {

    voiceEnabled =
        voiceToggle.checked;

    englishEnabled =
        englishToggle.checked;

    localStorage.setItem(
        "dmn_voice",
        voiceEnabled
    );

    localStorage.setItem(
        "dmn_english",
        englishEnabled
    );

    statusText.textContent =
        voiceEnabled
            ? "🔊 Sesli cevap açık"
            : "DMN hazır";

}


voiceToggle.addEventListener(
    "change",
    ayarlariGuncelle
);


englishToggle.addEventListener(
    "change",
    ayarlariGuncelle
);


settingsButton.addEventListener(
    "click",
    function() {

        settingsScreen.style.display =
            "block";

        messages.style.display =
            "none";

        inputArea.style.display =
            "none";

    }
);


newChatButton.addEventListener(
    "click",
    function() {

        yeniChat();

    }
);


mobileMenu.addEventListener(
    "click",
    function() {

        sidebar.classList.toggle(
            "open"
        );

    }
);


// =====================================
// MESAJ
// =====================================

function mesajEkle(text, role) {

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (
            role === "user"
                ? "user"
                : "dmn"
        );

    div.textContent =
        text;

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;

}


function resimGoster(src, role) {

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (
            role === "user"
                ? "user"
                : "dmn"
        );

    const img =
        document.createElement("img");

    img.src =
        src;

    img.className =
        "message-image";

    div.appendChild(img);

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;

}


// =====================================
// KOD İSTEĞİ
// =====================================

function kodIstegiMi(text) {

    const t =
        text.toLowerCase();

    return [
        "kod yaz",
        "kod ver",
        "kodu ver",
        "kod oluştur",
        "kod olustur",
        "program yaz",
        "program oluştur",
        "javascript kod",
        "arduino kod",
        "esp32 kod",
        "html kod",
        "css kod"
    ].some(
        word =>
            t.includes(word)
    );

}


// =====================================
// GÖRSEL İSTEĞİ
// =====================================

function resimIstegiMi(text) {

    const t =
        text.toLowerCase();

    return [
        "resim oluştur",
        "resim olustur",
        "resim yap",
        "görsel oluştur",
        "gorsel olustur",
        "fotoğraf oluştur",
        "fotoğraf olustur",
        "çiz",
        "görsel üret",
        "gorsel üret"
    ].some(
        word =>
            t.includes(word)
    );

}


// =====================================
// GÖRSEL OLUŞTUR
// =====================================

async function resimOlustur(prompt) {

    const loading =
        document.createElement("div");

    loading.className =
        "message dmn";

    loading.textContent =
        "🎨 Görsel oluşturuluyor...";

    messages.appendChild(
        loading
    );

    try {

        const response =
            await fetch(
                "/api/image",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        prompt: prompt
                    })

                }
            );


        const data =
            await response.json();

        loading.remove();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Görsel oluşturulamadı."
            );

        }


        const div =
            document.createElement("div");

        div.className =
            "message dmn";

        const img =
            document.createElement("img");

        img.src =
            data.image;

        img.className =
            "generated-image";

        div.appendChild(img);

        messages.appendChild(div);

        messages.scrollTop =
            messages.scrollHeight;


        mesajKaydet(
            "dmn",
            "",
            data.image
        );


    } catch (error) {

        loading.remove();

        mesajEkle(
            "DMN: " +
            error.message,
            "dmn"
        );

    }

}


// =====================================
// CHAT GÖNDER
// =====================================

async function mesajGonder() {

    const mesaj =
        input.value.trim();

    if (
        !mesaj &&
        !selectedImage &&
        !selectedFile
    ) {

        return;

    }


    if (!currentChatId) {

        yeniChat();

    }


    if (mesaj) {

        mesajEkle(
            "Sen: " + mesaj,
            "user"
        );

        mesajKaydet(
            "user",
            "Sen: " + mesaj,
            null
        );

    }


    if (selectedImage) {

        resimGoster(
            selectedImage,
            "user"
        );

        mesajKaydet(
            "user",
            "",
            selectedImage
        );

    }


    const image =
        selectedImage;

    const file =
        selectedFile;


    input.value = "";

    selectedImage = null;

    selectedFile = null;

    imageInput.value = "";

    fileInput.value = "";

    preview.style.display =
        "none";

    previewImage.src = "";


    if (
        mesaj &&
        resimIstegiMi(mesaj) &&
        !image
    ) {

        await resimOlustur(
            mesaj
        );

        return;

    }


    const loading =
        document.createElement("div");

    loading.className =
        "message dmn";

    loading.textContent =
        englishEnabled
            ? "DMN is thinking..."
            : "DMN düşünüyor...";

    messages.appendChild(
        loading
    );

    messages.scrollTop =
        messages.scrollHeight;


    try {

        let fileContent = "";

        let fileName = "";


        if (file) {

            fileName =
                file.name;

            if (
                file.type.startsWith(
                    "text/"
                ) ||
                /\.(js|html|css|cpp|c|h|json|py|txt)$/i
                    .test(file.name)
            ) {

                fileContent =
                    await file.text();

            }

        }


        const response =
            await fetch(
                "/api/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            mesaj,

                        english:
                            englishEnabled,

                        codeMode:
                            kodIstegiMi(mesaj),

                        image:
                            image,

                        fileName:
                            fileName,

                        fileContent:
                            fileContent

                    })

                }
            );


        const data =
            await response.json();

        loading.remove();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "DMN cevap veremedi."
            );

        }


        mesajEkle(
            "DMN: " + data.reply,
            "dmn"
        );


        mesajKaydet(
            "dmn",
            "DMN: " + data.reply,
            null
        );


        kodKopyalamaButonlariEkle();


        if (voiceEnabled) {

            sesliOku(
                data.reply
            );

        }


    } catch (error) {

        loading.remove();

        mesajEkle(
            "DMN: " +
            error.message,
            "dmn"
        );

        console.error(
            error
        );

    }

}


// =====================================
// KOD KOPYALAMA
// =====================================

function kodKopyalamaButonlariEkle() {

    document
        .querySelectorAll(
            ".dmn"
        )
        .forEach(message => {

            if (
                message.dataset
                    .processed === "true"
            ) {
                return;
            }

            const text =
                message.textContent;

            if (
                !text.includes("```")
            ) {
                return;
            }

            message.dataset
                .processed = "true";

            const parts =
                text.split("```");

            message.innerHTML = "";

            parts.forEach(
                (part, index) => {

                    if (
                        index % 2 === 0
                    ) {

                        if (
                            part.trim()
                        ) {

                            const p =
                                document.createElement(
                                    "div"
                                );

                            p.textContent =
                                part;

                            message.appendChild(
                                p
                            );

                        }

                    } else {

                        const wrapper =
                            document.createElement(
                                "div"
                            );

                        wrapper.className =
                            "code-wrapper";


                        const header =
                            document.createElement(
                                "div"
                            );

                        header.className =
                            "code-header";


                        const label =
                            document.createElement(
                                "span"
                            );

                        label.textContent =
                            "Kod";


                        const copy =
                            document.createElement(
                                "button"
                            );

                        copy.className =
                            "copy-button";

                        copy.textContent =
                            "Kopyala";


                        copy.onclick =
                            async function() {

                                await navigator.clipboard.writeText(
                                    part
                                        .replace(
                                            /^(javascript|cpp|html|css|python)\s*/i,
                                            ""
                                        )
                                        .trim()
                                );

                                copy.textContent =
                                    "Kopyalandı ✓";

                                setTimeout(
                                    function() {

                                        copy.textContent =
                                            "Kopyala";

                                    },
                                    1500
                                );

                            };


                        header.appendChild(
                            label
                        );

                        header.appendChild(
                            copy
                        );


                        const pre =
                            document.createElement(
                                "pre"
                            );

                        const code =
                            document.createElement(
                                "code"
                            );

                        code.textContent =
                            part.trim();

                        pre.appendChild(
                            code
                        );

                        wrapper.appendChild(
                            header
                        );

                        wrapper.appendChild(
                            pre
                        );

                        message.appendChild(
                            wrapper
                        );

                    }

                }

            );

        });

}

imageInput.addEventListener(
    "change",
    function() {

        const file =

        }

            new FileReader();

        reader.onload =
            function(event) {

                preview.style.display =

);

// =====================================
// SESLİ OKUMA
// =====================================

function sesMetniniTemizle(text) {

    let temiz =
        text || "";

    temiz =
        temiz.replace(
            /```[\s\S]*?```/g,
            " "
        );

    temiz =
        temiz.replace(
            /`[^`]*`/g,
            " "
        );

    temiz =
        temiz.replace(
            /https?:\/\/\S+/gi,
            " "
        );

    temiz =
        temiz.replace(
            /[\u{1F300}-\u{1FAFF}]/gu,
            " "
        );

    temiz =
        temiz.replace(
            /[\u{1F1E6}-\u{1F1FF}]/gu,
            " "
        );

    temiz =
        temiz.replace(
            /[\u2600-\u27BF]/g,
            " "
        );

    temiz =
        temiz.replace(
            /[#*_~]/g,
            " "
        );

    temiz =
        temiz.replace(
            /\s+/g,
            " "
        );

    return temiz.trim();

}


function uygunSesBul(sesler) {

    const dil =
        englishEnabled
            ? "en"
            : "tr";


    let ses =
        sesler.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .startsWith(dil)
        );


    if (!ses) {

        ses =
            sesler.find(
                voice =>
                    voice.lang
                        .toLowerCase()
                        .includes(dil)
            );

    }


    return ses;

}


function sesliOku(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    const temiz =
        sesMetniniTemizle(
            text
        );


    if (!temiz) {
        return;
    }


    window.speechSynthesis.cancel();


    const sesler =
        window.speechSynthesis
            .getVoices();


    const voice =
        uygunSesBul(
            sesler
        );


    const utterance =
        new SpeechSynthesisUtterance(
            temiz
        );


    if (voice) {

        utterance.voice =
            voice;

    }


    utterance.lang =
        englishEnabled
            ? "en-US"
            : "tr-TR";


    utterance.rate =
        0.95;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    utterance.onstart =
        function() {

            statusText.textContent =
                "🔊 Konuşuyor...";

        };


    utterance.onend =
        function() {

            ayarlariGuncelle();

        };


    utterance.onerror =
        function() {

            statusText.textContent =
                "Ses kullanılamıyor";

        };


    window.speechSynthesis.speak(
        utterance
    );

}


// =====================================
// SESLİ KOMUT
// =====================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            micButton.textContent =
                "🔴";

            statusText.textContent =
                "🎤 Dinliyorum...";

        };


    recognition.onend =
        function() {

            micButton.textContent =
                "🎤";

            ayarlariGuncelle();

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Mikrofon:",
                event.error
            );

            micButton.textContent =
                "🎤";

            statusText.textContent =
                "Mikrofon kullanılamıyor";

        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript;

            input.value =
                text;

            mesajGonder();

        };

} else {

    micButton.disabled =
        true;

}


micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {
            return;
        }

        recognition.lang =
            englishEnabled
                ? "en-US"
                : "tr-TR";

        try {

            recognition.start();

        } catch (error) {

            console.log(
                error
            );

        }

    }
);

// GÖNDER
// =====================================

sendButton.addEventListener(
    "click",
    mesajGonder
);


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            mesajGonder();

        }

    }
);

if (
    "speechSynthesis" in window
) {

    window.speechSynthesis
        .onvoiceschanged =
        function() {

            window.speechSynthesis
                .getVoices();

        };

}
