<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMN AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0d10;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: #101318;
            border-bottom: 1px solid #252830;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .online {
            margin-left: 12px;
            color: #65e6a4;
            font-size: 13px;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px 15px 120px;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 18px;
            padding: 15px 18px;
            border-radius: 16px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background: #1d2735;
        }

        .dmn {
            background: #15191f;
        }

        .name {
            font-size: 12px;
            opacity: .55;
            margin-bottom: 7px;
        }

        .bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px;
            background: #101318;
            border-top: 1px solid #252830;
        }

        .input-area {
            max-width: 900px;
            margin: auto;
            display: flex;
            gap: 8px;
        }

        textarea {
            flex: 1;
            min-height: 52px;
            max-height: 150px;
            resize: none;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #30343c;
            outline: none;
            background: #171a20;
            color: white;
            font-size: 16px;
        }

        button {
            width: 52px;
            min-width: 52px;
            height: 52px;
            border: 0;
            border-radius: 14px;
            background: #252b35;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #343b48;
        }

        .send {
            background: white;
            color: black;
        }

        .send:hover {
            background: #ddd;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        /* SES EKRANI */

        .voice-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: none;
            align-items: center;
            justify-content: center;

            background: rgba(5, 7, 12, .94);
        }

        .voice-overlay.active {
            display: flex;
        }

        .voice-box {
            text-align: center;
        }

        .orb {
            width: 170px;
            height: 170px;
            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 32% 28%,
                    white 0%,
                    #b8c0ff 12%,
                    #707dff 30%,
                    #3f4cff 55%,
                    #1719a8 100%
                );

            box-shadow:
                0 0 25px rgba(100, 115, 255, .9),
                0 0 70px rgba(80, 90, 255, .6),
                0 0 130px rgba(60, 70, 255, .35);

            animation: idle 2s infinite ease-in-out;
        }

        .orb.speaking {
            animation: speaking .45s infinite alternate ease-in-out;
        }

        @keyframes idle {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes speaking {
            0% {
                transform: scale(.88);
            }

            100% {
                transform: scale(1.22);
            }
        }

        .voice-status {
            margin-top: 30px;
            font-size: 18px;
        }

        .close-button {
            margin-top: 25px;
            width: auto;
            padding: 0 22px;
        }

        @media (max-width: 600px) {
            .orb {
                width: 140px;
                height: 140px;
            }

            .message {
                max-width: 95%;
            }

            .bottom {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <div class="logo">DMN</div>
        <div class="online">● ONLINE</div>
    </header>

    <div id="chat" class="chat"></div>

    <div class="bottom">

        <div class="input-area">

            <textarea
                id="message"
                placeholder="DMN'ye bir şey sor..."
            ></textarea>

            <button
                id="micButton"
                title="Sesli konuş"
            >🎤</button>

            <button
                id="sendButton"
                class="send"
                title="Gönder"
            >➤</button>

        </div>

    </div>

</div>


<!-- SES EKRANI -->

<div
    id="voiceOverlay"
    class="voice-overlay"
>

    <div class="voice-box">

        <div
            id="orb"
            class="orb"
        ></div>

        <div
            id="voiceStatus"
            class="voice-status"
        >
            DMN dinliyor...
        </div>

        <button
            id="closeButton"
            class="close-button"
        >
            Kapat
        </button>

    </div>

</div>


<script>

const chat =
    document.getElementById("chat");

const messageInput =
    document.getElementById("message");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const voiceOverlay =
    document.getElementById("voiceOverlay");

const orb =
    document.getElementById("orb");

const voiceStatus =
    document.getElementById("voiceStatus");

const closeButton =
    document.getElementById("closeButton");


/* ==========================
   MESAJ EKLE
========================== */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const name =
        document.createElement("div");

    name.className = "name";

    name.textContent =
        type === "user"
            ? "Sen"
            : "DMN";

    const content =
        document.createElement("div");

    content.textContent = text;

    message.appendChild(name);
    message.appendChild(content);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* ==========================
   YAZILI MESAJ
========================== */

async function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) return;

    addMessage(text, "user");

    messageInput.value = "";

    sendButton.disabled = true;

    try {

        const response =
            await fetch("/api/chat", {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: text
                })
            });

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "DMN cevap veremedi."
            );
        }

        addMessage(
            data.reply || "Boş cevap.",
            "dmn"
        );

    } catch (error) {

        addMessage(
            "Hata: " + error.message,
            "dmn"
        );

    } finally {

        sendButton.disabled = false;

    }
}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* ==========================
   SES TANIMA
========================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang = "tr-TR";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart =
        function() {

            voiceOverlay.classList.add(
                "active"
            );

            orb.classList.remove(
                "speaking"
            );

            voiceStatus.textContent =
                "Dinliyorum...";
        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0].transcript;

            voiceStatus.textContent =
                "DMN düşünüyor...";

            sendVoiceMessage(text);
        };


    recognition.onerror =
        function(event) {

            console.error(
                "Ses tanıma hatası:",
                event.error
            );

            voiceStatus.textContent =
                "Mikrofon kullanılamadı.";

            setTimeout(
                closeVoice,
                1500
            );
        };


    recognition.onend =
        function() {

            if (
                voiceStatus.textContent ===
                "Dinliyorum..."
            ) {
                closeVoice();
            }
        };

} else {

    micButton.disabled = true;

    micButton.title =
        "Bu tarayıcı ses tanımayı desteklemiyor.";
}


/* ==========================
   MİKROFON
========================== */

micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {

            alert(
                "Tarayıcınız sesli konuşmayı desteklemiyor."
            );

            return;
        }

        voiceOverlay.classList.add(
            "active"
        );

        voiceStatus.textContent =
            "Dinliyorum...";

        try {
            recognition.start();
        } catch (error) {
            console.log(error);
        }
    }
);


/* ==========================
   SESLİ MESAJ GÖNDER
========================== */

async function sendVoiceMessage(text) {

    try {

        addMessage(text, "user");

        const response =
            await fetch("/api/chat", {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: text
                })
            });

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "DMN cevap veremedi."
            );
        }

        const reply =
            data.reply || "";

        addMessage(
            reply,
            "dmn"
        );

        speakDMN(reply);

    } catch (error) {

        voiceStatus.textContent =
            "Hata oluştu.";

        addMessage(
            "Hata: " + error.message,
            "dmn"
        );

        setTimeout(
            closeVoice,
            1500
        );
    }
}


/* ==========================
   DMN SESLİ CEVAP
========================== */

function speakDMN(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        voiceStatus.textContent =
            "Tarayıcınız sesli cevabı desteklemiyor.";

        setTimeout(
            closeVoice,
            2000
        );

        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang = "tr-TR";

    utterance.rate = 1;

    utterance.pitch = 1;

    utterance.volume = 1;


    utterance.onstart =
        function() {

            voiceOverlay.classList.add(
                "active"
            );

            orb.classList.add(
                "speaking"
            );

            voiceStatus.textContent =
                "DMN konuşuyor...";
        };


    utterance.onend =
        function() {

            orb.classList.remove(
                "speaking"
            );

            voiceStatus.textContent =
                "Tamamlandı.";

            setTimeout(
                closeVoice,
                800
            );
        };


    utterance.onerror =
        function() {

            orb.classList.remove(
                "speaking"
            );

            voiceStatus.textContent =
                "Ses oynatılamadı.";

            setTimeout(
                closeVoice,
                1500
            );
        };


    window.speechSynthesis.speak(
        utterance
    );
}


/* ==========================
   KAPAT
========================== */

function closeVoice() {

    voiceOverlay.classList.remove(
        "active"
    );

    orb.classList.remove(
        "speaking"
    );

    if (
        "speechSynthesis" in window
    ) {
        window.speechSynthesis.cancel();
    }
}


closeButton.addEventListener(
    "click",
    closeVoice
);


/* ==========================
   BAŞLANGIÇ
========================== */

addMessage(
    "Merhaba! Ben DMN. Sana nasıl yardımcı olabilirim?",
    "dmn"
);

</script>

</body>
</html>
